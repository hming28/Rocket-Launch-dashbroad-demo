<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AETHER-9 飞行控制台</title>
<style>
:root {
  --bg: #05070B;
  --tx: #F4F7FA;
  --t2: #8A94A3;
  --ac: #4FD1FF;
  --wn: #FFB020;
  --cr: #FF4D5E;
  --ln: rgba(255, 255, 255, 0.09);
  color-scheme: dark;
  box-sizing: border-box;
}
*, *:before, *:after { box-sizing: inherit; }
html, body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--tx);
  font-family: 'Space Grotesk', 'Inter', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
  overflow: hidden;
  user-select: none;
}
#app {
  position: fixed;
  inset: 0;
  background: linear-gradient(180deg, #05070B 0%, #0A1522 48%, #16283A 74%, #0B0F15 74.1%, #07090D 100%);
}
#ph3d {
  position: absolute;
  left: 0; right: 0; top: 40%;
  text-align: center;
  font-size: 13px;
  letter-spacing: .32em;
  color: rgba(138, 148, 163, 0.45);
  pointer-events: none;
}
#vg {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(5,7,11,0.75), rgba(5,7,11,0) 140px);
  pointer-events: none;
}

/* Typography & Common Utilities */
.lb {
  font-size: 11px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--t2);
  font-weight: 500;
  line-height: 1.2;
}
.m {
  font-size: 14px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}
.row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 6px 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  gap: 10px;
}
.row span:first-child { font-size: 12px; color: var(--t2); }
button {
  font-family: inherit;
  color: var(--tx);
  cursor: pointer;
}
button:focus-visible {
  outline: 2px solid var(--ac);
  outline-offset: 2px;
}
.pill {
  font-size: 12px;
  font-weight: 500;
  background: rgba(5, 7, 11, 0.6);
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 8px;
  height: 30px;
  padding: 0 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all .15s ease;
}
.pill:hover {
  border-color: rgba(255, 255, 255, 0.35);
  background: rgba(255, 255, 255, 0.05);
}
.bt {
  height: 44px;
  min-width: 44px;
  padding: 0 14px;
  font-size: 13px;
  font-weight: 500;
  background: transparent;
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all .15s ease;
}
.bt.pr {
  background: var(--ac);
  color: #05202B;
  border-color: var(--ac);
  font-weight: 600;
}
.bt.pr:hover {
  background: #6fe0ff;
}
.bt.go {
  border-radius: 22px;
  width: 44px;
  height: 44px;
  padding: 0;
}
.bt.ab {
  position: relative;
  overflow: hidden;
  border-color: rgba(255, 77, 94, 0.6);
  color: var(--cr);
  font-weight: 600;
  letter-spacing: .08em;
  padding: 0 16px;
  height: 40px;
}
.bt.ab #abf {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 0%;
  background: rgba(255, 77, 94, 0.38);
  pointer-events: none;
}
.bt.ab span { position: relative; z-index: 2; }
.sim-badge {
  font-size: 9px;
  padding: 1px 4px;
  border-radius: 3px;
  background: rgba(255, 176, 32, 0.16);
  color: var(--wn);
  border: 1px solid rgba(255, 176, 32, 0.4);
  font-weight: 600;
  letter-spacing: .06em;
  display: inline-block;
}

/* ==================== 顶栏 (Top Bar) ==================== */
#bar-top {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 40px;
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--ln);
  background: rgba(5, 7, 11, 0.72);
  z-index: 30;
}
.top-left {
  display: flex;
  align-items: baseline;
  gap: 14px;
}
.brand-title {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: .16em;
  color: var(--tx);
}
.top-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* 分段开关 (Segmented Switch: 公众 | 工程) */
.seg-switch {
  display: inline-flex;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 8px;
  padding: 2px;
  height: 30px;
}
.seg-opt {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .06em;
  padding: 0 10px;
  border: none;
  background: transparent;
  color: var(--t2);
  border-radius: 6px;
  transition: all .15s ease;
}
.seg-opt.active {
  background: var(--ac);
  color: #05202B;
}

/* ==================== 顶部居中事件横幅 ==================== */
#banner-wrap {
  position: absolute;
  left: 0; right: 0; top: 56px;
  text-align: center;
  pointer-events: none;
  z-index: 10;
}
#phn {
  font-size: 15px;
  letter-spacing: .38em;
  color: var(--ac);
  font-weight: 600;
}
#phs {
  font-size: 13px;
  color: var(--t2);
  margin-top: 4px;
  letter-spacing: .04em;
}
#alr {
  display: none;
  margin-top: 10px;
  padding: 5px 14px;
  border-radius: 8px;
  font-size: 12px;
  letter-spacing: .03em;
  transition: opacity .3s;
}
#fl, #vd {
  position: absolute;
  left: 0; right: 0;
  text-align: center;
  pointer-events: none;
  transition: opacity .3s;
}
#fl {
  top: 32%;
  font-size: 52px;
  font-weight: 600;
  letter-spacing: .18em;
  opacity: 0;
}
#vd {
  top: 36%;
  font-size: 46px;
  font-weight: 700;
  letter-spacing: .12em;
  opacity: 0;
}

/* ==================== 右上角轨迹小地图 ==================== */
#minimap-wrap {
  position: absolute;
  top: 56px;
  right: 24px;
  border-radius: 50%;
  overflow: hidden;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
  z-index: 15;
  transition: width .2s ease, height .2s ease;
}
body.is-public #minimap-wrap { width: 160px; height: 160px; }
body.is-engineering #minimap-wrap { width: 200px; height: 200px; }
#minimap {
  display: block;
  width: 100%;
  height: 100%;
}

/* ==================== 底部仪表盘主容器 ==================== */
#dash-panel {
  position: fixed;
  left: 24px; right: 24px; bottom: 12px;
  background: rgba(5, 7, 11, 0.78);
  border: 1px solid rgba(255, 255, 255, 0.09);
  border-radius: 14px;
  z-index: 20;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: height .2s ease;
}
body.is-public #dash-panel { height: 148px; }
body.is-engineering #dash-panel { height: 200px; }

/* ==================== 公众版底部仪表盘 ==================== */
#dash-pub {
  height: 84px;
  padding: 8px 24px 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.pub-row1 {
  display: flex;
  align-items: center;
  gap: 28px;
}
.pub-clock {
  font-size: 44px;
  font-weight: 600;
  letter-spacing: .02em;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
.pub-stat-tile {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.pub-stat-tile .pub-lbl {
  font-size: 11px;
  letter-spacing: .12em;
  color: var(--t2);
  text-transform: uppercase;
}
.pub-stat-tile .pub-val {
  font-size: 32px;
  font-weight: 500;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.pub-stat-tile .pub-val small {
  font-size: 14px;
  color: var(--t2);
  margin-left: 4px;
}
.pub-health-cap {
  margin-left: auto;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  border-radius: 20px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.12);
  font-size: 13px;
  font-weight: 500;
}
.pub-health-cap .hdot {
  font-size: 10px;
  color: var(--ac);
}
.pub-row2 {
  margin-top: 6px;
  font-size: 13px;
  color: #C8D0DA;
  letter-spacing: .02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#bReplayPub {
  font-weight: 600;
  background: rgba(79, 209, 255, 0.15);
  border-color: var(--ac);
  color: var(--ac);
}

/* ==================== 工程版底部仪表盘 ==================== */
#dash-eng {
  height: 124px;
  display: grid;
  grid-template-columns: 1fr 340px 1fr;
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
}
.dash-zone {
  position: relative;
  height: 100%;
  display: flex;
  align-items: center;
  padding: 0 16px;
  overflow: hidden;
}
.dash-zone:not(:last-child) {
  border-right: 1px solid rgba(255, 255, 255, 0.08);
}

/* 左区: 一级箭体 */
.dash-left {
  display: flex;
  align-items: center;
  gap: 16px;
}
.eng1-card {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
.eng1-svg-box {
  width: 92px;
  height: 92px;
  flex-shrink: 0;
}
.eng1-info {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 110px;
}
.eng1-title {
  font-size: 11px;
  letter-spacing: .08em;
  color: var(--t2);
}
.eng1-stat {
  font-size: 14px;
  font-weight: 600;
  color: var(--ac);
}
.eng1-row {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--t2);
  gap: 8px;
}
.eng1-row .val {
  color: var(--tx);
  font-variant-numeric: tabular-nums;
  font-weight: 500;
}

/* 一级推进剂 */
.prop1-card {
  display: flex;
  flex-direction: column;
  gap: 4px;
  width: 130px;
  flex-shrink: 0;
}
.prop-hdr {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
}
.prop-bar-box {
  position: relative;
  height: 8px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 4px;
  overflow: visible;
}
.prop-bar-fill {
  height: 100%;
  background: var(--ac);
  border-radius: 4px;
  transition: width .2s ease;
}
.prop-tick {
  position: absolute;
  top: -2px;
  bottom: -2px;
  width: 2px;
  background: var(--wn);
  border-radius: 1px;
}
.prop-margin {
  font-size: 11px;
  font-variant-numeric: tabular-nums;
  color: var(--t2);
}

/* 情境指标小部件 (96px 固定宽度小块) */
.ctx-box {
  display: flex;
  align-items: center;
  gap: 8px;
  overflow: hidden;
}
.ctx-mod {
  width: 96px;
  height: 100px;
  padding: 8px 10px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  flex-shrink: 0;
  opacity: 1;
  transition: width .2s ease, opacity .2s ease, margin .2s ease, padding .2s ease;
  overflow: hidden;
}
.ctx-mod.mod-enter {
  width: 0 !important;
  opacity: 0 !important;
  margin: 0 !important;
  padding: 0 !important;
  border-width: 0 !important;
}
.ctx-mod.mod-exit {
  width: 0 !important;
  opacity: 0 !important;
  margin: 0 !important;
  padding: 0 !important;
  border-width: 0 !important;
  transition: width .15s ease, opacity .15s ease, margin .15s ease, padding .15s ease;
}
.ctx-mod .ctx-title {
  font-size: 10px;
  letter-spacing: .08em;
  color: var(--t2);
  text-transform: uppercase;
}
.ctx-mod .ctx-val {
  font-size: 20px;
  font-weight: 600;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.ctx-mod .ctx-bar {
  height: 4px;
  background: rgba(255, 255, 255, 0.12);
  border-radius: 2px;
  position: relative;
  overflow: visible;
}
.ctx-mod .ctx-bar-fill {
  height: 100%;
  background: var(--ac);
  border-radius: 2px;
}
.ctx-mod .ctx-tick {
  position: absolute;
  top: -2px; bottom: -2px;
  width: 2px;
  border-radius: 1px;
}
.ctx-mod .ctx-sub {
  font-size: 10px;
  color: var(--t2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* 中区: 时钟、下一事件、速度、高度 */
.dash-center {
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 0 16px;
  gap: 3px;
}
.dc-row1 {
  display: flex;
  align-items: center;
  gap: 12px;
}
.dc-clock {
  font-size: 38px;
  font-weight: 600;
  letter-spacing: .02em;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
.dc-paused-badge {
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 4px;
  background: rgba(255, 176, 32, 0.2);
  color: var(--wn);
  border: 1px solid rgba(255, 176, 32, 0.4);
  font-weight: 600;
  letter-spacing: .08em;
}
.dc-row2-center {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  gap: 8px;
  margin-top: 1px;
}
.dc-next {
  font-size: 12px;
  color: var(--t2);
  letter-spacing: .04em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.eng-health-pill {
  height: 22px;
  padding: 0 8px;
  font-size: 11px;
  gap: 5px;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.12);
  color: var(--tx);
  cursor: pointer;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  transition: all .15s ease;
}
.eng-health-pill .hdot {
  font-size: 8px;
  color: var(--ac);
}
.eng-health-pill:hover {
  border-color: var(--ac);
  background: rgba(79, 209, 255, 0.1);
}
.dc-row3 {
  display: flex;
  align-items: baseline;
  gap: 28px;
  margin-top: 2px;
}
.dc-val-group {
  display: flex;
  align-items: baseline;
  gap: 6px;
}
.dc-val-group .lb {
  font-size: 11px;
}
.dc-val-group .vnum {
  font-size: 26px;
  font-weight: 500;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.dc-val-group .vnum small {
  font-size: 13px;
  color: var(--t2);
  font-weight: 400;
  margin-left: 2px;
}

/* 右区: 分离前一级细节，分离后二级发动机 */
.dash-right {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.r-content-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 14px;
  height: 100%;
  position: relative;
}
.r-fade-wrap {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  transition: opacity 150ms ease;
}
.s2-badge-flash {
  position: absolute;
  top: 4px; left: 0;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .12em;
  color: var(--ac);
  background: rgba(79, 209, 255, 0.16);
  border: 1px solid var(--ac);
  border-radius: 4px;
  padding: 2px 6px;
  animation: s2flash 1.2s ease forwards;
  pointer-events: none;
  z-index: 5;
}
@keyframes s2flash {
  0% { opacity: 0; transform: translateY(-4px); }
  20%, 80% { opacity: 1; transform: translateY(0); }
  100% { opacity: 0; transform: translateY(-4px); }
}

/* 一级飞行细节 (s1d): 4 个数字块 */
.s1d-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px 14px;
  flex: 1;
}
.s1d-cell {
  display: flex;
  flex-direction: column;
}
.s1d-cell .lb { font-size: 10px; }
.s1d-cell .m { font-size: 16px; font-weight: 600; margin-top: 1px; }
.s1d-cell .sub { font-size: 10px; color: var(--t2); }
.s1d-cell.highlight-q .m { color: var(--ac); }

/* 二级发动机与推进剂 (eng2 + prop2) */
.s2-group {
  display: flex;
  align-items: center;
  gap: 14px;
  flex: 1;
}
.mvac-svg-box {
  width: 76px;
  height: 76px;
  flex-shrink: 0;
}
.s2-info {
  display: flex;
  flex-direction: column;
  gap: 3px;
  flex: 1;
}
.s2-title-row {
  display: flex;
  align-items: center;
  gap: 6px;
}
.s2-status {
  font-size: 13px;
  font-weight: 600;
  color: var(--ac);
}
.s2-chk-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
  font-size: 10px;
  line-height: 1.3;
  color: var(--t2);
}
.s2-chk-list .done { color: var(--ac); }
.prop2-card {
  width: 90px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  flex-shrink: 0;
}

/* ==================== 线性时间轴 (Linear Timeline) ==================== */
#timeline-wrap {
  position: relative;
  width: 100%;
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  overflow: visible;
}
body.is-public #timeline-wrap { height: 64px; }
body.is-engineering #timeline-wrap { height: 76px; }

.tl-track-area {
  position: relative;
  margin: 0 40px;
  height: 10px;
  display: flex;
  align-items: center;
}
.tl-rail {
  position: absolute;
  left: 0; right: 0;
  height: 4px;
  background: rgba(255, 255, 255, 0.18);
  border-radius: 2px;
}
.tl-seg {
  position: absolute;
  top: 3px;
  height: 4px;
  border-radius: 2px;
  pointer-events: auto;
  cursor: pointer;
  transition: filter .15s ease;
}
.tl-seg:hover {
  filter: brightness(1.35);
}
.tl-maxq-overlay {
  position: absolute;
  top: 1px;
  height: 8px;
  background: rgba(255, 176, 32, 0.28);
  border-radius: 4px;
  pointer-events: none;
}
.tl-dot {
  position: absolute;
  top: -0.5px;
  left: 0;
  width: 11px;
  height: 11px;
  margin-left: -5.5px;
  pointer-events: none;
  z-index: 10;
  will-change: transform;
}
.tl-dot-core {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: var(--ac);
  box-shadow: 0 0 12px 3px rgba(79, 209, 255, 0.85);
  transition: background .2s, box-shadow .2s;
}
.tl-dot.breathing .tl-dot-core {
  animation: dotBreathe 1.2s ease-in-out infinite;
}
@keyframes dotBreathe {
  0%, 100% { transform: scale(1); box-shadow: 0 0 10px 2px rgba(79, 209, 255, 0.8); }
  50% { transform: scale(1.4); box-shadow: 0 0 18px 5px rgba(79, 209, 255, 1); }
}
.tl-dot.aborted .tl-dot-core {
  background: var(--cr) !important;
  box-shadow: 0 0 14px 4px rgba(255, 77, 94, 0.9) !important;
  animation: none !important;
}
.tl-node {
  position: absolute;
  top: 1px;
  width: 8px;
  height: 8px;
  margin-left: -4px;
  border-radius: 50%;
  z-index: 6;
  pointer-events: none;
}
.tl-node.passed {
  background: #FFFFFF;
  border: 1.5px solid #FFFFFF;
}
.tl-node.current {
  background: var(--ac);
  border: 1.5px solid var(--ac);
  box-shadow: 0 0 8px var(--ac);
}
.tl-node.future {
  background: #05070B;
  border: 1.5px solid rgba(255, 255, 255, 0.4);
}
.tl-lbl {
  position: absolute;
  transform: translateX(-50%);
  font-size: 11px;
  color: var(--t2);
  white-space: nowrap;
  pointer-events: none;
  line-height: 1;
  transition: color .2s;
}
.tl-lbl.active {
  color: var(--ac);
  font-weight: 600;
}
.tl-lbl.row-0 { top: -30px; }
.tl-lbl.row-1 { top: -13px; }
.tl-lbl.tl-minor-narrow { opacity: 0.35; font-size: 9px; }
.tl-dur {
  position: absolute;
  top: 14px;

        return `<g data-e="${i}" style="cursor:pointer" aria-label="发动机 ${i}">

function updEngineMatrix(s, t) {
  const pl = planSet(t), activeCount = pl.filter(i => !fl[i] && s.th > 0).length;
  EA.forEach(i => {
    const p = pl.includes(i), f = fl[i], on = p && !f && s.th > 0;
    const c = $('c_ec' + i), x = $('c_ex' + i);
    if (c) {
      c.setAttribute('fill', f ? 'rgba(255,77,94,.22)' : on ? 'rgba(79,209,255,' + (.35 + .65 * s.th_eff / 100) + ')' : 'transparent');
      c.setAttribute('stroke', f ? '#FF4D5E' : p ? '#4FD1FF' : 'rgba(255,255,255,.22)');
    }
    if (x) x.setAttribute('display', f ? '' : 'none');
  });
  const stat = $('e1-stat'), thrust = $('e1-thrust'), throt = $('e1-throt');
  if (stat) stat.textContent = (pl.length ? activeCount + ' / ' + pl.length : '0 / 0') + ' ' + L('在线', 'ACTIVE');
  if (thrust) thrust.textContent = Math.round(s.kN) + ' kN';
  if (throt) throt.textContent = Math.round(s.th_eff) + ' %';
}

function initAbortBtn() {
  const btn = $('bAb');
  if (!btn) return;
  const f = $('abf');
  const abEnd = () => {
    if (abortTimer) { clearTimeout(abortTimer); abortTimer = null; }
    if (f) { f.style.transition = 'width .15s ease'; f.style.width = '0%'; }
  };
  const abStart = () => {
    if (abortTimer || ab || fin) return;
    if (f) { f.style.transition = 'width 1s linear'; f.style.width = '100%'; }
    abortTimer = setTimeout(() => { abEnd(); abort(); }, 1000);
  };
  ['pointerup', 'pointerleave', 'pointercancel', 'blur', 'keyup'].forEach(n => btn.addEventListener(n, abEnd));
  btn.addEventListener('pointerdown', abStart);
  btn.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); abStart(); } });
}

          const defaultWidgets = side === 'left' ? ['eng1', 'prop1', 'g', 'thr'] : ['s1d', 'eng2', 'prop2', 'none'];
          userLayout[side][idx] = { slot: idx + 1, mode: 'auto', widget: defaultWidgets[idx] };

          // 禁止重复放置小部件 (除了 none 与 auto)
          if (val !== 'none') {
            let duplicateFound = false;
            ['left', 'right'].forEach(s => {
              userLayout[s].forEach((item, sIdx) => {
                if (!(s === side && sIdx === idx)) {
                  if (item.mode === 'fixed' && item.widget === val) {

          saveSettings();
          showTab();
          initDashboardDOM();
          draw();
          flash('alr', L('布局配置导入成功', 'Layout imported successfully'), 'var(--ac)', 1500);
        } else {
          throw new Error('Invalid');
        }
      } catch (err) {
        flash('alr', L('配置格式错误', 'Invalid layout JSON'), 'var(--cr)', 1800);
      }
    };
  } else if (tab === 5) {
    e.innerHTML = `<div class="lg">${log.length ? log.join('<br>') : L('暂无事件', 'No events')}</div>`;

function applyPreset(name) {
  if (name === 'default') {
    userLayout = JSON.parse(JSON.stringify(DEFAULT_LAYOUT));
  } else if (name === 'launch') {
    userLayout = {
      preset: 'launch',
      left: [

function saveLayout() {

}
function loadLayout() {
  try {
    const raw = localStorage.getItem('aether.layout');
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.left) && Array.isArray(parsed.right)) userLayout = parsed;
    }
  } catch (e) {}
}

function saveSettings() {
  try {
    localStorage.setItem('aether.variant', variant);
    localStorage.setItem('aether.lang', lang);
    localStorage.setItem('aether.speed', String(spd));
  } catch (e) {}
  saveLayout();
}

function loadSettings() {
  try {
    const hash = window.location.hash.toLowerCase();
    if (hash === '#engineering') variant = 'engineering';
    else if (hash === '#public') variant = 'public';
    else {
      const savedVar = localStorage.getItem('aether.variant');
      if (savedVar === 'engineering' || savedVar === 'public') variant = savedVar;
    }
    const savedLang = localStorage.getItem('aether.lang');
    if (savedLang === 'zh' || savedLang === 'en') {
      lang = savedLang;
      document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    }
    const savedSpd = +localStorage.getItem('aether.speed');
    if (sp.includes(savedSpd)) spd = savedSpd;
  } catch (e) {}
  loadLayout();
}
const saveVariantSettings = saveSettings;
const loadVariantSettings = loadSettings;

// ==================== 动态仪表盘渲染 ====================
let lastMountedMods = new Set();
let lastRightMode = ''; // 's1d' or 's2'

function updateContextModules(s) {
  const box = $('ctx-box');
  if (!box) return;

  // 根据当前 t 和 DASH 规则（或布局覆盖）筛选出应显示的情境模块
  const needed = new Set();
  DASH.forEach(rule => {
    if (rule.zone === 'L' && rule.mod !== 'eng1' && rule.mod !== 'prop1') {
      if (t >= rule.win[0] && t < rule.win[1]) needed.add(rule.mod);
    }
  });

  // 如果用户在布局编辑器中指定了 fixed 部件，做合并处理
  userLayout.left.forEach(slot => {
    if (slot.mode === 'fixed') {
      if (['g', 'thr', 'heat', 'brk', 'verdict'].includes(slot.widget)) needed.add(slot.widget);
    }
  });

  // 1. 移除已过期的模块
  lastMountedMods.forEach(modId => {
    if (!needed.has(modId)) {
      const el = $(`mod-${modId}`);
      if (el) {
        el.classList.add('mod-exit');
        setTimeout(() => { if (el.parentNode) el.remove(); }, 150);
      }
      lastMountedMods.delete(modId);
    }
  });

  // 2. 添加新增的模块
  needed.forEach(modId => {
    if (!lastMountedMods.has(modId)) {
      const el = document.createElement('div');
      el.id = `mod-${modId}`;
      el.className = 'ctx-mod mod-enter';
      el.innerHTML = buildModHtml(modId, s);
      box.appendChild(el);
      requestAnimationFrame(() => {
        el.classList.remove('mod-enter');
      });
      lastMountedMods.add(modId);
    }
  });

  // 3. 更新已有模块数据
  needed.forEach(modId => {
    const el = $(`mod-${modId}`);
    if (el) updModHtml(modId, el, s);
  });
}

function buildModHtml(modId, s, isRight) {
  if (modId === 'g') {
    const vId = isRight ? 'g-val-r' : 'g-val', bId = isRight ? 'g-bar-r' : 'g-bar';
    return `
      <div class="ctx-title">${L('过载', 'G-LOAD')}</div>
      <div class="ctx-val" id="${vId}">${s.nG.toFixed(1)} G</div>
      <div class="ctx-bar">
        <div class="ctx-bar-fill" id="${bId}" style="width:${cl(s.nG/6*100,0,100)}%"></div>
        <div class="ctx-tick" style="left:75%;background:var(--wn)" title="4.5G"></div>
        <div class="ctx-tick" style="left:91.7%;background:var(--cr)" title="5.5G"></div>
      </div>
      <div class="ctx-sub">0–6 G</div>`;
  }
  if (modId === 'thr') {
    const vId = isRight ? 'thr-val-r' : 'thr-val', bId = isRight ? 'thr-bar-r' : 'thr-bar';
    return `
      <div class="ctx-title" style="color:var(--ac)">${L('节流深度', 'THROTTLE')}</div>
      <div class="ctx-val" id="${vId}" style="color:var(--ac)">−${Math.round(s.depth)}%</div>
      <div class="ctx-bar"><div class="ctx-bar-fill" id="${bId}" style="width:${(s.depth/30)*100}%;background:var(--ac)"></div></div>
      <div class="ctx-sub" style="color:var(--ac)">${L('Max-Q 通过中', 'Max-Q Throttling')}</div>`;
  }
  if (modId === 'heat') {
    const vId = isRight ? 'heat-val-r' : 'heat-val';
    return `
      <div class="ctx-title">${L('热流', 'HEAT FLUX')}</div>
      <div class="ctx-val" id="${vId}">${Math.round(s.heat)} <small style="font-size:11px">kW/m²</small></div>
      <div class="ctx-bar" style="background:linear-gradient(to right, #6b0000, #ff4500, #ffa500, #ffffaa)">
        <div class="ctx-bar-fill" style="background:transparent"></div>
      </div>
      <div class="ctx-sub">${s.heat > 120 ? L('高温注意', 'HIGH HEAT') : L('黑体辐射', 'Radiative')}</div>`;
  }
  if (modId === 'brk') {
    const b0 = mg(s, t)[0];
    const vId = isRight ? 'brk-val-r' : 'brk-val', bId = isRight ? 'brk-bar-r' : 'brk-bar', sId = isRight ? 'brk-sub-r' : 'brk-sub';
    return `
      <div class="ctx-title">${L('制动余量', 'BRAKE MARGIN')}</div>
      <div class="ctx-val" id="${vId}">${b0.v}</div>
      <div class="ctx-bar"><div class="ctx-bar-fill" id="${bId}" style="width:${b0.p}%;background:${b0.s === 2 ? 'var(--cr)' : b0.s === 1 ? 'var(--wn)' : 'var(--ac)'}"></div></div>
      <div class="ctx-sub" id="${sId}">${b0.s === 2 ? L('不足', 'CRITICAL') : b0.s === 1 ? L('偏低', 'LOW') : L('充足', 'NOMINAL')}</div>`;
  }
  if (modId === 'verdict') {
    const bad = s.pg > 4.5 || short;
    const vId = isRight ? 'vd-val-r' : 'vd-val';
    return `
      <div class="ctx-title">${L('判定结果', 'VERDICT')}</div>
      <div class="ctx-val" id="${vId}" style="color:${bad ? 'var(--cr)' : 'var(--ac)'}">${bad ? L('坠毁', 'LOST') : L('成功', 'LANDED')}</div>
      <div class="ctx-sub">${s.tdv.toFixed(1)} m/s · ${s.pg.toFixed(1)} G</div>
      <div class="ctx-sub">${L('缓冲行程', 'Stroke')} ${cfg.stroke.toFixed(2)} m</div>`;
  }
  if (modId === 'q') {
    const vId = isRight ? 'q-val-r' : 'q-val', bId = isRight ? 'q-bar-r' : 'q-bar';
    return `
      <div class="ctx-title" style="color:var(--ac)">${L('动压 Q', 'DYN. Q')}</div>
      <div class="ctx-val" id="${vId}" style="color:var(--ac)">${s.q.toFixed(1)} <small style="font-size:11px">kPa</small></div>
      <div class="ctx-bar"><div class="ctx-bar-fill" id="${bId}" style="width:${cl(s.q/30*100,0,100)}%;background:var(--ac)"></div></div>
      <div class="ctx-sub">${L('峰值 26.9 kPa', 'Peak 26.9 kPa')}</div>`;
  }
  if (modId === 'mach') {
    const vId = isRight ? 'mach-val-r' : 'mach-val', bId = isRight ? 'mach-bar-r' : 'mach-bar', sId = isRight ? 'mach-sub-r' : 'mach-sub';
    return `
      <div class="ctx-title">${L('马赫数', 'MACH')}</div>
      <div class="ctx-val" id="${vId}">M ${s.M.toFixed(2)}</div>
      <div class="ctx-bar"><div class="ctx-bar-fill" id="${bId}" style="width:${cl(s.M/8*100,0,100)}%"></div></div>
      <div class="ctx-sub" id="${sId}">${s.M > 1 ? L('超声速', 'SUPERSONIC') : L('亚声速', 'SUBSONIC')}</div>`;
  }
  if (modId === 'cd') {
    const isTrans = Math.abs(s.M - 1.1) < .28;
    const vId = isRight ? 'cd-val-r' : 'cd-val', bId = isRight ? 'cd-bar-r' : 'cd-bar', sId = isRight ? 'cd-sub-r' : 'cd-sub';
    return `
      <div class="ctx-title">${L('阻力系数', 'DRAG CD')}</div>
      <div class="ctx-val" id="${vId}">${s.Cd.toFixed(3)}${isTrans ? ' ▲' : ''}</div>
      <div class="ctx-bar"><div class="ctx-bar-fill" id="${bId}" style="width:${cl(s.Cd/0.9*100,0,100)}%"></div></div>
      <div class="ctx-sub" id="${sId}">${isTrans ? L('跨声速峰', 'Transonic Peak') : L('正常气动', 'Nominal')}</div>`;
  }
  if (modId === 'margin') {
    const m0 = mg(s, t)[0];
    const vId = isRight ? 'mg-val-r' : 'mg-val', bId = isRight ? 'mg-bar-r' : 'mg-bar', sId = isRight ? 'mg-sub-r' : 'mg-sub';
    return `
      <div class="ctx-title">${L('最紧裕度', 'TIGHTEST MARGIN')}</div>
      <div class="ctx-val" id="${vId}" style="font-size:15px">${m0.v}</div>
      <div class="ctx-bar"><div class="ctx-bar-fill" id="${bId}" style="width:${m0.p}%;background:${m0.s===2?'var(--cr)':m0.s===1?'var(--wn)':'var(--ac)'}"></div></div>
      <div class="ctx-sub" id="${sId}">${L(m0.z, m0.e)}</div>`;
  }
  return '';
}

function updModHtml(modId, el, s, isRight) {
  if (modId === 'g') {
    const vId = isRight ? '#g-val-r' : '#g-val', bId = isRight ? '#g-bar-r' : '#g-bar';
    const val = el.querySelector(vId), bar = el.querySelector(bId);
    if (val) {
      val.textContent = s.nG.toFixed(1) + ' G';
      val.style.color = s.nG >= 5.5 ? 'var(--cr)' : s.nG >= 4.5 ? 'var(--wn)' : 'var(--tx)';
    }
    if (bar) {
      bar.style.width = cl(s.nG / 6 * 100, 0, 100) + '%';
      bar.style.background = s.nG >= 5.5 ? 'var(--cr)' : s.nG >= 4.5 ? 'var(--wn)' : 'var(--ac)';
    }
  } else if (modId === 'thr') {
    const vId = isRight ? '#thr-val-r' : '#thr-val', bId = isRight ? '#thr-bar-r' : '#thr-bar';
    const val = el.querySelector(vId), bar = el.querySelector(bId);
    if (val) val.textContent = `−${Math.round(s.depth)}%`;
    if (bar) bar.style.width = `${(s.depth / 30) * 100}%`;
  } else if (modId === 'heat') {
    const vId = isRight ? '#heat-val-r' : '#heat-val';
    const val = el.querySelector(vId);
    if (val) val.innerHTML = `${Math.round(s.heat)} <small style="font-size:11px">kW/m²</small>`;
  } else if (modId === 'brk') {
    const b0 = mg(s, t)[0];
    const vId = isRight ? '#brk-val-r' : '#brk-val', bId = isRight ? '#brk-bar-r' : '#brk-bar', sId = isRight ? '#brk-sub-r' : '#brk-sub';
    const val = el.querySelector(vId), bar = el.querySelector(bId), sub = el.querySelector(sId);
    if (val) {
      val.textContent = b0.v;
      val.style.color = b0.s === 2 ? 'var(--cr)' : b0.s === 1 ? 'var(--wn)' : 'var(--tx)';
    }
    if (bar) {
      bar.style.width = b0.p + '%';
      bar.style.background = b0.s === 2 ? 'var(--cr)' : b0.s === 1 ? 'var(--wn)' : 'var(--ac)';
    }
    if (sub) sub.textContent = b0.s === 2 ? L('不足', 'CRITICAL') : b0.s === 1 ? L('偏低', 'LOW') : L('充足', 'NOMINAL');
  } else if (modId === 'verdict') {
    const bad = s.pg > 4.5 || short;
    const vId = isRight ? '#vd-val-r' : '#vd-val';
    const val = el.querySelector(vId);
    if (val) {
      val.textContent = bad ? L('坠毁', 'LOST') : L('成功', 'LANDED');
      val.style.color = bad ? 'var(--cr)' : 'var(--ac)';
    }
  } else if (modId === 'q') {
    const vId = isRight ? '#q-val-r' : '#q-val', bId = isRight ? '#q-bar-r' : '#q-bar';
    const val = el.querySelector(vId), bar = el.querySelector(bId);
    if (val) val.innerHTML = `${s.q.toFixed(1)} <small style="font-size:11px">kPa</small>`;
    if (bar) bar.style.width = cl(s.q / 30 * 100, 0, 100) + '%';
  } else if (modId === 'mach') {
    const vId = isRight ? '#mach-val-r' : '#mach-val', bId = isRight ? '#mach-bar-r' : '#mach-bar', sId = isRight ? '#mach-sub-r' : '#mach-sub';
    const val = el.querySelector(vId), bar = el.querySelector(bId), sub = el.querySelector(sId);
    if (val) val.textContent = `M ${s.M.toFixed(2)}`;
    if (bar) bar.style.width = cl(s.M / 8 * 100, 0, 100) + '%';
    if (sub) sub.textContent = s.M > 1 ? L('超声速', 'SUPERSONIC') : L('亚声速', 'SUBSONIC');
  } else if (modId === 'cd') {
    const isTrans = Math.abs(s.M - 1.1) < .28;
    const vId = isRight ? '#cd-val-r' : '#cd-val', bId = isRight ? '#cd-bar-r' : '#cd-bar', sId = isRight ? '#cd-sub-r' : '#cd-sub';
    const val = el.querySelector(vId), bar = el.querySelector(bId), sub = el.querySelector(sId);
    if (val) val.textContent = s.Cd.toFixed(3) + (isTrans ? ' ▲' : '');
    if (bar) bar.style.width = cl(s.Cd / 0.9 * 100, 0, 100) + '%';
    if (sub) sub.textContent = isTrans ? L('跨声速峰', 'Transonic Peak') : L('正常气动', 'Nominal');
  } else if (modId === 'margin') {
    const m0 = mg(s, t)[0];
    const vId = isRight ? '#mg-val-r' : '#mg-val', bId = isRight ? '#mg-bar-r' : '#mg-bar', sId = isRight ? '#mg-sub-r' : '#mg-sub';
    const val = el.querySelector(vId), bar = el.querySelector(bId), sub = el.querySelector(sId);
    if (val) val.textContent = m0.v;
    if (bar) {
      bar.style.width = m0.p + '%';
      bar.style.background = m0.s === 2 ? 'var(--cr)' : m0.s === 1 ? 'var(--wn)' : 'var(--ac)';
    }
    if (sub) sub.textContent = L(m0.z, m0.e);
  }
}

    if (qVal) qVal.textContent = s.q.toFixed(1) + ' kPa';
    if (qBox) qBox.classList.toggle('highlight-q', t >= 64 && t < 92);
    if (cd) cd.textContent = s.Cd.toFixed(3) + (Math.abs(s.M - 1.1) < .28 ? ' ▲' : '');
  }
  if ($('mod-eng2')) {
    const s2 = getStage2State(t);
    const stat = $('s2-stat'), plm = $('c_s2_plume'), core = $('c_s2_core');
    if (stat) stat.textContent = L(s2.statusTextZh, s2.statusTextEn);
    if (plm) plm.style.opacity = s2.plumeOp;
    if (core) core.setAttribute('fill', s2.thrust > 0 ? '#4FD1FF' : 'transparent');

    const c1 = $('chk1'), c2 = $('chk2'), c3 = $('chk3'), c4 = $('chk4');
    if (c1) { c1.className = t >= 150 ? 'done' : ''; c1.innerHTML = (t >= 150 ? '✓ ' : '○ ') + L('MECO 确认', 'MECO Verified'); }
    if (c2) { c2.className = t >= 152 ? 'done' : ''; c2.innerHTML = (t >= 152 ? '✓ ' : '○ ') + L('分离指令', 'Sep Command'); }
    if (c3) { c3.className = t >= 156 ? 'done' : ''; c3.innerHTML = (t >= 156 ? '✓ ' : '○ ') + L('分离确认', 'Stage Sep'); }
    if (c4) { c4.className = t >= 162 ? 'done' : ''; c4.innerHTML = (t >= 162 ? '✓ ' : '○ ') + L('SES-1 点火 (934 kN)', 'SES-1 (934 kN)'); }
  }
  if ($('mod-prop2')) {
    const s2 = getStage2State(t);
    const p2Fill = $('p2-fill'), p2Pct = $('p2-pct');
    if (p2Fill) p2Fill.style.width = s2.pr2.toFixed(1) + '%';
    if (p2Pct) p2Pct.textContent = s2.pr2.toFixed(1) + '%';
  }
  // 更新自定义右侧槽位中的小部件
  if (!isDefaultOrAuto) {
    userLayout.right.forEach(slot => {
      const w = slot.widget;
      if (!['s1d', 'eng2', 'prop2', 'none'].includes(w)) {
        const el = $(`mod-${w}-r`);
        if (el) updModHtml(w, el, s, true);
      }
    });
  }
}


// ==================== 线性时间轴渲染 ====================
function updateTimeline(tVal) {
  const trackArea = $('tlTrackArea');
  if (!trackArea) return;
  const W = Math.max(300, trackArea.clientWidth);
  const currentX = (tVal / END) * W;

  // 1. 恒速圆点位置计算与无延迟设置
  const dot = $('tl-dot');
  if (dot) {
    dot.style.transform = `translateX(${currentX}px)`;
    dot.setAttribute('aria-valuenow', tVal.toFixed(1));
    dot.classList.toggle('breathing', run && !ab && !fin);
    dot.classList.toggle('aborted', ab);
  }

  // 2. 线段线宽比例与颜色填充
  const ph = P.filter(p => p <= tVal).length - 1;
  for (let k = 0; k < 8; k++) {
    const seg = $(`tl-seg-${k}`);
    if (!seg) continue;
    const xStart = (P[k] / END) * W;
    const xEnd = (P[k + 1] / END) * W;
    const segW = Math.max(2, xEnd - xStart - 2);
    seg.style.left = `${xStart + 1}px`;
    seg.style.width = `${segW}px`;

    if (tVal >= P[k + 1]) {
      seg.style.background = 'rgba(255, 255, 255, 0.90)';
    } else if (tVal < P[k]) {
      seg.style.background = 'rgba(255, 255, 255, 0.18)';
    } else {
      if (ab) {
        seg.style.background = 'var(--cr)';
      } else {
        const pct = Math.max(0, Math.min(100, (tVal - P[k]) / (P[k + 1] - P[k]) * 100));
        seg.style.background = `linear-gradient(to right, var(--ac) 0%, var(--ac) ${pct}%, rgba(255,255,255,0.18) ${pct}%)`;
      }
    }
  }

  // 3. Max-Q 琥珀色半透明带 (64–92s)
  const mq = $('tlMaxQ');
  if (mq) {
    const mqS = (64 / END) * W, mqE = (92 / END) * W;
    mq.style.left = `${mqS}px`;
    mq.style.width = `${mqE - mqS}px`;
    mq.setAttribute('title', L('Max-Q 动压峰值窗口: 64s - 92s (峰值 77s)', 'Max-Q Window: 64s - 92s (Peak 77s)'));
  }

  // 4. 节点与动态避让标签
  const isNarrow = W < 600;
  const secondaryNodes = [1, 3, 5, 7];
  let lastRow = 0;
  let lastX = -999;
  for (let k = 0; k < 9; k++) {
    const node = $(`tl-node-${k}`), lbl = $(`tl-lbl-${k}`);
    const nodeX = (P[k] / END) * W;
    const nodeTitle = `${L(NZ[k], NE[k])} (T+${P[k]}s)`;
    if (node) {
      node.style.left = `${nodeX}px`;
      node.className = 'tl-node ' + (k < ph ? 'passed' : k === ph ? 'current' : 'future');
      node.setAttribute('title', nodeTitle);
    }
    if (lbl) {
      lbl.style.left = `${nodeX}px`;
      lbl.textContent = L(NZ[k], NE[k]);
      lbl.setAttribute('title', nodeTitle);
      lbl.classList.toggle('active', k === ph);

      // 动态避碰：若相邻两个事件在时间轴上物理像素距离 < 48px 或时间跨度 < 6s，自动交替错位 (双行标注)
      let row = 0;
      if (k > 0) {
        const dx = nodeX - lastX;
        const dt = P[k] - P[k - 1];
        if (dx < 48 || dt < 6) {
          row = (lastRow === 0) ? 1 : 0;
        } else {
          row = 0;
        }
      }
      lastRow = row;
      lastX = nodeX;
      lbl.classList.toggle('row-0', row === 0);
      lbl.classList.toggle('row-1', row === 1);

      // 当窗口极窄时（< 600px），次要阶段标签文本自动淡化，避免重叠
      if (isNarrow && secondaryNodes.includes(k) && k !== ph) {
        lbl.classList.add('tl-minor-narrow');
      } else {
        lbl.classList.remove('tl-minor-narrow');
      }
    }
  }

  // 5. 各线段时长标注与悬停提示 (线段宽度 < 44px 时隐藏文字，但悬停仍显示完整信息)
  for (let k = 0; k < 8; k++) {
    const seg = $(`tl-seg-${k}`), dur = $(`tl-dur-${k}`);
    const durSec = P[k + 1] - P[k];
    const segW = ((P[k + 1] - P[k]) / END) * W;
    const segTip = k === 2
      ? L('Max-Q 窗口: 64s - 92s (持续 28s)', 'Max-Q Window: 64s - 92s (dur 28s)')
      : `${L(NZ[k], NE[k])} → ${L(NZ[k + 1], NE[k + 1])}: ${P[k]}s - ${P[k + 1]}s (${L('持续', 'dur')} ${durSec}s)`;
    if (seg) seg.setAttribute('title', segTip);
    if (dur) {
      dur.textContent = durSec + ' s';
      dur.style.left = `${((P[k] + P[k + 1]) / (2 * END)) * W}px`;
      dur.style.display = segW < 44 ? 'none' : 'block';
      dur.setAttribute('title', segTip);
    }
  }
}

// 轨迹小地图绘制函数
function drawMinimap(canvas) {
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);

  // 底色与边框
  ctx.fillStyle = 'rgba(5, 7, 11, 0.85)';
  ctx.beginPath();
  ctx.arc(w / 2, h / 2, w / 2, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.save();
  ctx.beginPath();
  ctx.arc(w / 2, h / 2, w / 2 - 2, 0, Math.PI * 2);
  ctx.clip();

  // 地球曲率弧线
  ctx.strokeStyle = 'rgba(79, 209, 255, 0.35)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  const earthRadius = w * 0.95;
  ctx.arc(w / 2, h + earthRadius * 0.58, earthRadius, 0, Math.PI * 2);
  ctx.stroke();

  // 125 km 最高顶点标线
  const apogeeY = h * 0.22;
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.16)';
  ctx.setLineDash([3, 3]);
  ctx.beginPath();
  ctx.moveTo(w * 0.12, apogeeY);
  ctx.lineTo(w * 0.88, apogeeY);
  ctx.stroke();
  ctx.setLineDash([]);

  // 理论轨迹线 (t=6 至 428)
  const startX = w * 0.14, endX = w * 0.86;
  const groundY = h * 0.82;
  const trajH = groundY - apogeeY;

  ctx.strokeStyle = 'rgba(255, 255, 255, 0.28)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let st = 6; st <= END; st += 4) {
    const s_st = S(st);
    const px = startX + (endX - startX) * (st - 6) / 422;
    const py = groundY - (s_st.alt / 125000) * trajH;
    if (st === 6) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.stroke();

  // 当前位置青色圆点
  const s = S(t);
  const curPx = startX + (endX - startX) * Math.max(0, t - 6) / 422;
  const curPy = groundY - (s.alt / 125000) * trajH;

  ctx.fillStyle = 'rgba(79, 209, 255, 0.3)';
  ctx.beginPath();
  ctx.arc(curPx, curPy, 7, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#4FD1FF';
  ctx.beginPath();
  ctx.arc(curPx, curPy, 3.5, 0, Math.PI * 2);
  ctx.fill();

  // 标注文字
  ctx.fillStyle = 'rgba(138, 148, 163, 0.75)';
  ctx.font = '9px "Space Grotesk", sans-serif';
  ctx.fillText('125 km', w * 0.14, apogeeY - 4);

  ctx.restore();
}

// ==================== 仿真循环 Tick 与 Draw ====================
function tick() {
  lastTickWallTime = performance.now();
  if (run && !ab && !fin) {
    t = Math.min(END, t + .1 * spd);
    const s = S(t);
    const b0 = mg(s, t)[0];
    if (b0.r != null && b0.r < 0) short = true;

    const ph = P.filter(p => p <= t).length - 1;
    if (ph !== lp) {
      lp = ph;
      ev(L(NZ[ph], NE[ph]));
      if (ph > 0) flash('fl', L(NZ[ph], NE[ph]), 'var(--tx)', 1800);
      const sr = $('sr-live');
      if (sr) sr.textContent = `${L(NZ[ph], NE[ph])}: ${L(PUB_DESC[ph].zh, PUB_DESC[ph].en)}`;
    }

    if (t >= 420 && !fin) {
      fin = true;
      run = false;
      const bad = s.pg > 4.5 || short;
      hist.unshift({ b: cfg.burn, k: cfg.stroke, v: s.tdv, g: s.pg, bad });
      ev(bad ? L('判定: 坠毁', 'Verdict: LOST') : L('判定: 着陆成功', 'Verdict: LANDED'));
      flash('vd', bad ? 'VEHICLE LOST' : 'TOUCHDOWN CONFIRMED', bad ? 'var(--cr)' : 'var(--ac)', 0);
    }
  }
  draw();
}

function draw() {
  const s = S(t), ph = P.filter(p => p <= t).length - 1, m = mg(s, t);
  V = s;

  // 顶部与全局横幅
  $('sub').textContent = L('KSC LC-39A · 回收任务', 'KSC LC-39A · RECOVERY');
  $('phn').textContent = ab ? 'ABORT' : L(NE[ph].toUpperCase(), NE[ph].toUpperCase());
  $('phn').style.color = ab ? 'var(--cr)' : 'var(--ac)';
  $('phs').textContent = ab ? L('飞行终止', 'Flight terminated') : L(NZ[ph], NE[ph]) + (run ? '' : ' · ' + (fin ? L('已结束', 'ended') : L('待命', 'standby')));

  // 告警条
  const bad = m.filter(r => r.s > 0);
  const a = $('alr');
  if (bad.length && !ab && !fin && a.style.opacity !== '1') {
    const r = bad[0];
    a.style.display = 'inline-block';
    a.textContent = (r.s > 1 ? L('警告 · ', 'Warning · ') : L('注意 · ', 'Caution · ')) + L(r.z, r.e) + ' ' + r.v;
    const c = r.s > 1 ? '255,77,94' : '255,176,32';
    a.style.border = '1px solid rgba(' + c + ',.5)';
    a.style.background = 'rgba(' + c + ',.08)';
    a.style.color = r.s > 1 ? 'var(--cr)' : 'var(--wn)';
  } else if (!bad.length && a.style.opacity !== '1') {
    a.style.display = 'none';
  }

  // 顶栏按钮更新
  renderTopActions();

  // 根据当前版本更新视图
  if (variant === 'public') {
    const met = $('metPub'), vs = $('vsPub'), va = $('vaPub'), htxt = $('pubHealthTxt'), hdot = $('pubHealth') ? $('pubHealth').querySelector('.hdot') : null;
    const desc = $('pubDesc'), bGo = $('bGoPub'), bReplay = $('bReplayPub');
    if (met) met.textContent = fT(t);
    if (vs) vs.innerHTML = `${Math.round(s.v * 3.6).toLocaleString()} <small>km/h</small>`;
    if (va) va.innerHTML = `${fA(s.alt)}`;
    if (desc) desc.textContent = L(PUB_DESC[ph].zh, PUB_DESC[ph].en);
    if (bGo) bGo.innerHTML = run ? PA : PL;
    if (bReplay) bReplay.style.display = fin ? 'inline-flex' : 'none';

    if (htxt && hdot) {
      if (bad.length > 0 && bad[0].s === 2) {
        htxt.textContent = L('异常', 'WARNING');
        hdot.style.color = 'var(--cr)';
      } else if (bad.length > 0) {
        htxt.textContent = L('注意', 'CAUTION');
        hdot.style.color = 'var(--wn)';
      } else {
        htxt.textContent = L('一切正常', 'ALL NOMINAL');
        hdot.style.color = 'var(--ac)';
      }
    }
  } else {
    // 工程版视图更新
    const met = $('metEng'), nx = $('nxEng'), vs = $('vsEng'), va = $('vaEng'), bGo = $('bGoEng'), pBadge = $('pausedBadge');
    if (met) met.textContent = fT(t);
    if (pBadge) pBadge.style.display = (!run && !fin && !ab) ? 'inline-block' : 'none';
    if (nx) nx.textContent = ph < 8 ? L('下一事件 ', 'Next ') + L(NZ[ph + 1], NE[ph + 1]) + ' · ' + Math.ceil(P[ph + 1] - t) + ' s' : L('任务结束', 'End');
    if (vs) vs.innerHTML = `${Math.round(s.v * 3.6).toLocaleString()} <small>km/h</small>`;
    if (va) va.innerHTML = `${fA(s.alt)}`;
    if (bGo) bGo.innerHTML = run ? PA : PL;

    // 最紧裕度胶囊展示
    const mList = mg(s, t).filter(m => m.v !== '—');
    const tightest = mList.sort((a, b) => b.s - a.s || (b.s > 0 ? b.p - a.p : a.p - b.p))[0] || mg(s, t)[1];
    const bHealthEng = $('bHealthEng'), engHealthTxt = $('engHealthTxt');
    if (bHealthEng && engHealthTxt && tightest) {
      engHealthTxt.textContent = `${L('最紧裕度', 'Tightest')}: ${L(tightest.z, tightest.e)} ${tightest.v}`;
      const hdot = bHealthEng.querySelector('.hdot');
      const dotColor = tightest.s === 2 ? 'var(--cr)' : tightest.s === 1 ? 'var(--wn)' : 'var(--ac)';
      if (hdot) hdot.style.color = dotColor;
      bHealthEng.style.borderColor = tightest.s === 2 ? 'var(--cr)' : tightest.s === 1 ? 'var(--wn)' : 'rgba(255,255,255,0.18)';
    }

    // 一级发动机矩阵
    const pl = planSet(t), activeCount = pl.filter(i => !fl[i] && s.th > 0).length;
    EA.forEach(i => {
      const p = pl.includes(i), f = fl[i], on = p && !f && s.th > 0;
      const c = $('c_ec' + i), x = $('c_ex' + i);
      if (c) {
        c.setAttribute('fill', f ? 'rgba(255,77,94,.22)' : on ? 'rgba(79,209,255,' + (.35 + .65 * s.th_eff / 100) + ')' : 'transparent');
        c.setAttribute('stroke', f ? '#FF4D5E' : p ? '#4FD1FF' : 'rgba(255,255,255,.22)');
      }
      if (x) x.setAttribute('display', f ? '' : 'none');
    });
    const stat = $('e1-stat'), thrust = $('e1-thrust'), throt = $('e1-throt');
    if (stat) stat.textContent = (pl.length ? activeCount + ' / ' + pl.length : '0 / 0') + ' ' + L('在线', 'ACTIVE');
    if (thrust) thrust.textContent = Math.round(s.kN) + ' kN';
    if (throt) throt.textContent = Math.round(s.th_eff) + ' %';

    // 一级推进剂
    const p1Fill = $('p1-fill'), p1Pct = $('p1-pct'), p1Tick = $('p1-tick'), p1Margin = $('p1-margin');
    if (p1Fill) p1Fill.style.width = s.pr.toFixed(1) + '%';
    if (p1Pct) p1Pct.textContent = s.pr.toFixed(1) + '%';
    const need = t < 395 ? 22 : 2 + 12 * (s.alt / 3000);
    if (p1Tick) p1Tick.style.left = need + '%';
    if (p1Margin) {
      const marginT = (s.pr - need) * 5.2;
      p1Margin.textContent = `${L('余量', 'Margin')} ${(marginT >= 0 ? '+' : '')}${marginT.toFixed(1)} t`;
      p1Margin.style.color = marginT < 0 ? 'var(--cr)' : marginT < 5 ? 'var(--wn)' : 'var(--t2)';
    }

    // 更新情境指标与右侧区域
    updateContextModules(s);
    updateRightZone(s);

    // ABORT 按钮状态
    const bAb = $('bAb');
    if (bAb) bAb.disabled = ab || fin;
  }

  // 小地图与时间轴重绘
  drawMinimap($('minimap'));
  updateTimeline(t);

  // 若抽屉开启，刷新抽屉内容
  if (dr) showTab();
}

// 6.4 requestAnimationFrame 插值动画循环
function animLoop(now) {
  requestAnimationFrame(animLoop);
  if (run && !ab && !fin) {
    const elapsed = (now - lastTickWallTime) / 1000;
    const t_render = Math.min(END, Math.min(t + 0.1 * spd, t + elapsed * spd));
    updateTimeline(t_render);
  }
}
requestAnimationFrame(animLoop);

// ==================== 用户控制与交互 ====================
function go() {
  if (fin || ab) return;
  run = !run;
  if (run && t === 0) ev(L('倒计时开始', 'Sequence start'));
  $('vd').style.opacity = 0;
  draw();
}

function rst() {
  t = 0; run = false; ab = false; fin = false; lp = -1; log = []; short = false; fl.fill(0);
  lastRightMode = '';
  lastMountedMods.clear();
  $('vd').style.opacity = 0;
  $('fl').style.opacity = 0;
  initDashboardDOM();
  draw();
}

function abort() {
  if (ab || fin) return;
  ab = true; run = false; ev('ABORT');
  flash('vd', 'FLIGHT TERMINATED', 'var(--cr)', 0);
  const sr = $('sr-live');
  if (sr) sr.textContent = 'ABORT: FLIGHT TERMINATED';
  draw();
}

const sp = [1, 2, 5, 10];
const cs = () => { spd = sp[(sp.indexOf(spd) + 1) % 4]; draw(); saveVariantSettings(); };
const dw = () => { dr = !dr; $('drw').classList.toggle('open', dr); if (dr) showTab(); };

function setVariant(newVar) {
  variant = newVar;
  document.body.className = variant === 'public' ? 'is-public' : 'is-engineering';
  $('bPub').classList.toggle('active', variant === 'public');
  $('bEng').classList.toggle('active', variant === 'engineering');
  if (variant === 'public' && dr) {
    dr = false;
    $('drw').classList.remove('open');
  }
  window.location.hash = '#' + variant;
  saveVariantSettings();
  initDashboardDOM();
  draw();
}

function toggleVariant() {
  setVariant(variant === 'public' ? 'engineering' : 'public');
}

function toggleLanguage() {
  lang = lang === 'zh' ? 'en' : 'zh';
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  saveVariantSettings();
  initDashboardDOM();
  draw();
  if (dr) showTab();
}


// 键盘与全局事件监听
$('bPub').onclick = () => setVariant('public');
$('bEng').onclick = () => setVariant('engineering');
$('bLang').onclick = toggleLanguage;
$('tabs').onclick = e => { const b = e.target.closest('button'); if (b && b.dataset.t !== undefined) { tab = +b.dataset.t; showTab(); } };

window.addEventListener('hashchange', () => {
  const hash = window.location.hash.toLowerCase();
  if (hash === '#engineering' && variant !== 'engineering') setVariant('engineering');
  else if (hash === '#public' && variant !== 'public') setVariant('public');
});

window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.id === 'bAb') return;
  const k = e.key.toLowerCase();
  if (k === ' ') { e.preventDefault(); go(); }
  else if (k === 'r') {
    if (variant === 'engineering') rst();
  }
  else if (k === 'v') toggleVariant();
  else if (k === 'l') toggleLanguage();
  else if (k === 'd') {
    if (variant === 'engineering') dw();
  }
  else if (k === ']' || k === '[') {
    if (variant === 'engineering') cs();
  }
  else if (e.key === 'Escape') {
    if (dr) { dr = false; $('drw').classList.remove('open'); }
  }
});

// 初始化启动
loadVariantSettings();
loadLayout();
document.body.className = variant === 'public' ? 'is-public' : 'is-engineering';
$('bPub').classList.toggle('active', variant === 'public');
$('bEng').classList.toggle('active', variant === 'engineering');
initDashboardDOM();
draw();
setInterval(tick, 100);
</script>
