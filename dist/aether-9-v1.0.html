<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AETHER-9 飞行控制台</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#05070B;--tx:#F4F7FA;--t2:#8A94A3;--ac:#4FD1FF;--wn:#FFB020;--cr:#FF4D5E;--ln:rgba(255,255,255,.09);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:'Space Grotesk','Inter','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;overflow:hidden}
#app{position:fixed;inset:0;background:linear-gradient(180deg,#05070B 0%,#0A1522 48%,#16283A 74%,#0B0F15 74.1%,#07090D 100%)}
#ph3d{position:absolute;left:0;right:0;top:44%;text-align:center;font-size:12px;letter-spacing:.3em;color:rgba(138,148,163,.55);pointer-events:none}
#vg{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,7,11,.75),rgba(5,7,11,0) 150px);pointer-events:none}
.lb{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--t2);font-weight:500}
.m{font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
.xl{font-size:36px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}.xl small{font-size:14px;font-weight:400;color:var(--t2);margin-left:6px}
.tk{font-size:22px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}.m2{font-size:20px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
button{font-family:inherit;color:var(--tx);cursor:pointer}
.pill{font-size:12px;font-weight:500;background:rgba(5,7,11,.6);border:1px solid rgba(255,255,255,.14);border-radius:8px;height:32px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;transition:all .15s}
.pill:hover{border-color:rgba(255,255,255,.4)}
.pill.auto-pill{display:inline-flex;gap:6px;font-weight:600;letter-spacing:.05em}
.auto-pill .adot{font-size:9px;color:var(--ac);transition:color .2s}
.auto-pill.hold .adot{color:var(--wn)}
.bt{height:44px;min-width:44px;padding:0 14px;font-size:13px;font-weight:500;background:transparent;border:1px solid rgba(255,255,255,.18);border-radius:10px}
.bt.pr{background:var(--ac);color:#05202B;border-color:var(--ac);font-weight:600}
.bt.go{display:inline-flex;align-items:center;justify-content:center;border-radius:22px}
.bt.ab{position:relative;overflow:hidden;border-color:rgba(255,77,94,.6);color:var(--cr)}.bt.ab i{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,77,94,.35)}.bt.ab span{position:relative}
button:hover{border-color:rgba(255,255,255,.4)}button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.tr{height:3px;background:rgba(255,255,255,.12);border-radius:2px;margin-top:6px}.tr i{display:block;height:3px;border-radius:2px}
.row{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06);gap:10px}
.row span:first-child{font-size:12px;color:var(--t2)}
#tl{position:absolute;left:0;right:0;bottom:0;height:58px;z-index:6}
#tl .ln{position:absolute;left:5.55%;right:5.55%;top:26px;height:1px;background:rgba(255,255,255,.2)}
#tl .pg{position:absolute;left:5.55%;top:25px;height:3px;border-radius:2px;background:linear-gradient(90deg,rgba(244,247,250,.3),var(--tx) 75%,var(--ac));box-shadow:0 0 10px rgba(79,209,255,.5);transition:width .1s linear}
#tl .hdp{position:absolute;top:21px;left:5.55%;width:11px;height:11px;margin-left:-5.5px;border-radius:50%;background:var(--ac);box-shadow:0 0 14px 4px rgba(79,209,255,.7);transition:left .1s linear;z-index:2}
#tl.run .hdp{animation:pls 1.2s ease-in-out infinite}
@keyframes pls{0%,100%{transform:scale(1)}50%{transform:scale(1.5)}}
@keyframes rp{0%{box-shadow:0 0 0 0 rgba(79,209,255,.65)}100%{box-shadow:0 0 0 14px rgba(79,209,255,0)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(2)}100%{transform:scale(1)}}
#tl:not(.run) *{animation-play-state:paused}
#tl .hlb{position:absolute;top:0;left:5.55%;transform:translateX(-50%);font-size:12px;font-weight:500;line-height:16px;color:var(--ac);white-space:nowrap;transition:left .1s linear;pointer-events:none}
.nd span{position:absolute;top:14px;height:16px;display:flex;align-items:center;white-space:nowrap;opacity:0;transition:opacity .25s,color .3s}.nd.nx span{opacity:1}#tl:hover .nd span{opacity:1}.nd b{box-sizing:border-box;transition:background .3s,border-color .3s}.nd.d b{width:5px;height:5px;margin-top:2px}
#tl .nds{position:absolute;left:0;right:0;top:22px;display:flex}
.nd{flex:1;position:relative;display:flex;justify-content:center;font-size:11px;color:var(--t2)}
.nd b{width:9px;height:9px;border-radius:50%;background:var(--tx)}.nd.f b{background:transparent;border:1px solid var(--t2)}
.nd.c b{background:var(--ac);animation:rp 1.6s ease-out infinite}.nd.c{color:var(--ac)}.nd.pop b{animation:pop .6s ease-out}
#bar{position:absolute;left:0;right:0;bottom:58px;height:72px;background:rgba(5,7,11,.88);border-top:1px solid var(--ln);display:flex;align-items:center;justify-content:space-between;padding:0 32px;gap:16px;z-index:6}
#drw{position:absolute;top:0;right:0;bottom:130px;width:420px;max-width:100%;background:rgba(5,7,11,.96);border-left:1px solid var(--ln);transform:translateX(102%);transition:transform .18s cubic-bezier(.16,1,.3,1);padding:16px;overflow:auto;z-index:20}
#drw.o{transform:none}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;height:34px;font-size:12px;background:none;border:1px solid var(--ln);border-radius:8px}.tabs .on{border-color:var(--ac);color:var(--ac)}
#fl,#vd{position:absolute;left:0;right:0;text-align:center;pointer-events:none;transition:opacity .3s}
#fl{top:34%;font-size:56px;font-weight:500;letter-spacing:.2em;opacity:0}#vd{top:38%;font-size:48px;font-weight:600;letter-spacing:.12em;opacity:0}
input[type=range]{width:100%;accent-color:#4FD1FF}
.lg{font:12px/1.7 ui-monospace,Menlo,monospace;color:#C8D0DA}

/* ==================== 方案 B: 书签条 (Bookmark Strips) ==================== */
.bm-strip{position:absolute;top:68px;bottom:140px;width:34px;display:flex;flex-direction:column;gap:5px;z-index:12;user-select:none}
#bm-left{left:4px}
#bm-right{right:4px}
.bm-item{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:7px 2px;background:rgba(10,16,25,.75);border:1px solid rgba(255,255,255,.09);border-radius:6px;cursor:pointer;transition:all .18s cubic-bezier(.16,1,.3,1);color:var(--t2)}
.bm-item:hover{background:rgba(18,29,45,.95);border-color:rgba(79,209,255,.45);color:var(--tx);transform:scale(1.05);z-index:15}
.bm-item.active{background:rgba(79,209,255,.14);border-color:var(--ac);color:var(--tx);font-weight:600;box-shadow:0 0 10px rgba(79,209,255,.22)}
.bm-badge{font-size:10px;line-height:1;font-weight:700;color:var(--ac);margin-bottom:2px;font-variant-numeric:tabular-nums}
.bm-text{font-size:11px;letter-spacing:.06em;writing-mode:vertical-rl;text-orientation:upright;white-space:nowrap}
html[lang="en"] .bm-text{writing-mode:horizontal-tb;transform:rotate(-90deg);margin:8px 0;font-size:10px;letter-spacing:.08em}
.bm-alert{position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--wn);display:none}
.bm-alert.crit{background:var(--cr);animation:bmalert 1s infinite}
@keyframes bmalert{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.8);opacity:.6}}
.bm-hover-pop{position:absolute;top:50%;transform:translateY(-50%);background:rgba(5,10,18,.96);border:1px solid rgba(79,209,255,.38);border-radius:6px;padding:6px 12px;white-space:nowrap;font-size:12px;color:var(--tx);pointer-events:none;opacity:0;transition:opacity .15s,transform .15s;z-index:100;box-shadow:0 4px 18px rgba(0,0,0,.7)}
#bm-left .bm-hover-pop{left:40px;transform:translateY(-50%) translateX(-6px)}
#bm-left .bm-item:hover .bm-hover-pop{opacity:1;transform:translateY(-50%) translateX(0)}
#bm-right .bm-hover-pop{right:40px;transform:translateY(-50%) translateX(6px)}
#bm-right .bm-item:hover .bm-hover-pop{opacity:1;transform:translateY(-50%) translateX(0)}

/* ==================== 双侧卡片槽位容器 ==================== */
.slots-col{position:absolute;top:68px;bottom:140px;width:300px;display:flex;flex-direction:column;gap:12px;z-index:5}
#slots-left{left:42px}
#slots-right{right:42px}
.slot-box{flex:1;min-height:0;background:rgba(5,7,11,.78);border:1px solid var(--ln);border-radius:10px;backdrop-filter:blur(8px);display:flex;flex-direction:column;overflow:hidden;position:relative;transition:border-color .25s,box-shadow .25s,flex .25s}
.slot-box.slot-flash{border-color:var(--ac);box-shadow:0 0 16px rgba(79,209,255,.45)}
.slot-box.slot-target-select{border-color:var(--ac);animation:targetPulse 1s infinite alternate}
@keyframes targetPulse{from{box-shadow:0 0 4px rgba(79,209,255,.3)}to{box-shadow:0 0 16px rgba(79,209,255,.8)}}
.slot-box.expanded{flex:10}
.slot-box.collapsed{display:none}
.slot-hdr{height:34px;padding:0 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.02);flex-shrink:0}
.slot-tw{display:flex;align-items:center;gap:8px}
.slot-idx{font-size:11px;font-weight:700;color:var(--ac);letter-spacing:.08em}
.slot-title{font-size:12px;font-weight:500;color:var(--tx);letter-spacing:.04em}
.slot-sim-tag{font-size:9px;padding:1px 4px;border-radius:3px;background:rgba(255,176,32,.2);color:var(--wn);border:1px solid rgba(255,176,32,.4);font-weight:600;display:none}
.slot-acts{display:flex;align-items:center;gap:4px}
.slot-btn{width:24px;height:24px;padding:0;border-radius:4px;background:transparent;border:1px solid transparent;font-size:11px;display:inline-flex;align-items:center;justify-content:center;color:var(--t2);transition:all .15s}
.slot-btn:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:var(--tx)}
.slot-btn.pinned{color:var(--ac);border-color:rgba(79,209,255,.4);background:rgba(79,209,255,.15)}
.slot-btn.active-select{color:var(--wn);border-color:rgba(255,176,32,.4);background:rgba(255,176,32,.15)}
.slot-body{flex:1;padding:10px 14px;overflow-y:auto;overflow-x:hidden;position:relative}
.slot-body::-webkit-scrollbar{width:4px}
.slot-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:2px}

/* 卡片换入换出动画 */
.card-anim-out{opacity:0!important;transform:translateY(6px)!important;transition:opacity 120ms cubic-bezier(.4,0,1,1),transform 120ms cubic-bezier(.4,0,1,1)!important}
.card-anim-in{animation:cIn 180ms cubic-bezier(0,0,.2,1) forwards}
@keyframes cIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}

/* 自动调度 10s 预告通知条 */
.slot-prev-bar{position:absolute;bottom:0;left:0;right:0;background:rgba(10,24,38,.96);border-top:1px solid var(--ac);padding:5px 12px;font-size:11px;display:flex;justify-content:space-between;align-items:center;z-index:6;animation:prevSlide .2s ease}
@keyframes prevSlide{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sp-txt{color:var(--ac);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-right:8px}
.sp-btn{font-size:11px;padding:2px 8px;height:22px;border-radius:4px;background:rgba(79,209,255,.2);border:1px solid var(--ac);color:var(--tx);cursor:pointer;white-space:nowrap}
.sp-btn:hover{background:var(--ac);color:#05202B}

/* 响应式降级 */
@media(max-width:1100px){
  .bm-strip{display:none}
  #slots-left{left:16px;right:16px;width:auto;top:auto;bottom:140px;height:260px}
  #slots-right{display:none}
  #bar{padding:0 16px}
  .hd{display:none}
}
@media(prefers-reduced-motion:reduce){
  #drw,#fl,#vd{transition:none}
  #tl *{animation:none!important;transition:none!important}
  .card-anim-in,.card-anim-out{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="app">
<div id="ph3d">3D VIEWPORT · 占位 / PLACEHOLDER</div>
<div id="vg"></div>

<!-- 顶栏 -->
<div style="position:absolute;left:32px;right:32px;top:16px;height:32px;display:flex;justify-content:space-between;align-items:center;z-index:10">
  <div style="display:flex;gap:14px;align-items:baseline">
    <span style="font-size:18px;font-weight:600;letter-spacing:.16em">AETHER-9</span>
    <span class="lb hd" id="sub"></span>
  </div>
  <div style="display:flex;gap:8px">
    <button class="pill auto-pill" id="bAuto" title="切换自动调度 / 手动保持 (A)"><span class="adot">●</span><span id="autoTxt">AUTO</span></button>
    <button class="pill" id="bRst"></button>
    <button class="pill" id="bSp">1×</button>
    <button class="pill" id="bLang">中 / EN</button>
    <button class="pill" id="bDrw"></button>
  </div>
</div>

<!-- 阶段与事件横幅提示 -->
<div style="position:absolute;left:0;right:0;top:84px;text-align:center;pointer-events:none;z-index:8">
  <div id="phn" style="font-size:15px;letter-spacing:.4em;color:var(--ac);font-weight:500"></div>
  <div id="phs" style="font-size:13px;color:var(--t2);margin-top:6px"></div>
  <div id="alr" style="display:none;margin-top:14px;padding:6px 14px;border-radius:8px;font-size:12px;display:inline-block"></div>
</div>
<div id="fl"></div>
<div id="vd"></div>

<!-- 方案 B: 左侧书签条 -->
<div id="bm-left" class="bm-strip"></div>

<!-- 左侧两个槽位 (L1, L2) -->
<div id="slots-left" class="slots-col">
  <div class="slot-box" id="slot-l1" data-slot="l1">
    <div class="slot-hdr">
      <div class="slot-tw">
        <span class="slot-idx">L1</span>
        <span class="slot-title"></span>
        <span class="slot-sim-tag">SIM</span>
      </div>
      <div class="slot-acts">
        <button class="slot-btn btn-pin" title="钉住槽位 (P)">📌</button>
        <button class="slot-btn btn-swap" title="更换卡片 (Swap)">↻</button>
        <button class="slot-btn btn-exp" title="展开槽位 (Expand)">⤢</button>
      </div>
    </div>
    <div class="slot-body"></div>
    <div class="slot-prev-bar" style="display:none"><span class="sp-txt"></span><button class="sp-btn">保持</button></div>
  </div>
  <div class="slot-box" id="slot-l2" data-slot="l2">
    <div class="slot-hdr">
      <div class="slot-tw">
        <span class="slot-idx">L2</span>
        <span class="slot-title"></span>
        <span class="slot-sim-tag">SIM</span>
      </div>
      <div class="slot-acts">
        <button class="slot-btn btn-pin" title="钉住槽位 (P)">📌</button>
        <button class="slot-btn btn-swap" title="更换卡片 (Swap)">↻</button>
        <button class="slot-btn btn-exp" title="展开槽位 (Expand)">⤢</button>
      </div>
    </div>
    <div class="slot-body"></div>
    <div class="slot-prev-bar" style="display:none"><span class="sp-txt"></span><button class="sp-btn">保持</button></div>
  </div>
</div>

<!-- 右侧两个槽位 (R1, R2) -->
<div id="slots-right" class="slots-col">
  <div class="slot-box" id="slot-r1" data-slot="r1">
    <div class="slot-hdr">
      <div class="slot-tw">
        <span class="slot-idx">R1</span>
        <span class="slot-title"></span>
        <span class="slot-sim-tag">SIM</span>
      </div>
      <div class="slot-acts">
        <button class="slot-btn btn-pin" title="钉住槽位 (P)">📌</button>
        <button class="slot-btn btn-swap" title="更换卡片 (Swap)">↻</button>
        <button class="slot-btn btn-exp" title="展开槽位 (Expand)">⤢</button>
      </div>
    </div>
    <div class="slot-body"></div>
    <div class="slot-prev-bar" style="display:none"><span class="sp-txt"></span><button class="sp-btn">保持</button></div>
  </div>
  <div class="slot-box" id="slot-r2" data-slot="r2">
    <div class="slot-hdr">
      <div class="slot-tw">
        <span class="slot-idx">R2</span>
        <span class="slot-title"></span>
        <span class="slot-sim-tag">SIM</span>
      </div>
      <div class="slot-acts">
        <button class="slot-btn btn-pin" title="钉住槽位 (P)">📌</button>
        <button class="slot-btn btn-swap" title="更换卡片 (Swap)">↻</button>
        <button class="slot-btn btn-exp" title="展开槽位 (Expand)">⤢</button>
      </div>
    </div>
    <div class="slot-body"></div>
    <div class="slot-prev-bar" style="display:none"><span class="sp-txt"></span><button class="sp-btn">保持</button></div>
  </div>
</div>

<!-- 方案 B: 右侧书签条 -->
<div id="bm-right" class="bm-strip"></div>

<!-- 底栏与时间轴 -->
<div id="tl">
  <div class="ln"></div>
  <div class="pg" id="pg"></div>
  <div class="hdp" id="hdp"></div>
  <div class="hlb" id="hlb"></div>
  <div class="nds" id="nds"></div>
</div>
<div id="drw"><div class="tabs" id="tabs"></div><div id="db"></div></div>
<div id="bar">
  <div style="display:flex;align-items:center;gap:16px">
    <button class="bt pr go" id="bGo"></button>
    <div><div class="tk" id="met"></div><div id="nx" style="margin-top:6px;font-size:12px;color:var(--t2)"></div></div>
  </div>
  <div style="display:flex;gap:40px;align-items:flex-end">
    <div><div class="lb" id="ls"></div><div class="xl" id="vs" style="margin-top:6px"></div></div>
    <div><div class="lb" id="la"></div><div class="xl" id="va" style="margin-top:6px"></div></div>
    <div class="hd"><div class="lb" id="le"></div><div class="m2" id="ve" style="margin-top:8px"></div></div>
    <div class="hd"><div class="lb" id="lp"></div><div class="m2" id="vp" style="margin-top:8px"></div></div>
  </div>
  <button class="bt ab" id="bAb" title="Hold 1 s"><i id="abf"></i><span id="abt"></span></button>
</div>
</div>

<script>
// ==================== 物理仿真基础参数 ====================
const P=[0,6,70,150,156,190,330,395,420],END=428;
const NZ=['点火','离塔','MAX-Q','MECO','分离','转向','再入','着陆点火','触地'],NE=['Ignition','Liftoff','MAX-Q','MECO','Stage sep','Flip','Entry','Landing burn','Touchdown'];
const K=[[0,0,0,0,100],[5,0,0,100,99.9],[6,0,0,100,99.8],[70,12000,400,100,86],[150,68000,2300,100,30],[156,69000,2300,0,30],[190,110000,2150,2,30],[260,125000,1500,0,30],[330,75000,1800,0,29.8],[345,60000,1700,60,26],[362,40000,1000,60,21],[372,30000,700,0,21],[395,3000,210,86,20],[420,0,3,86,6],[422,0,0,0,6],[428,0,0,0,6]];
const PK=[[6,90],[150,40],[190,-30],[330,-80],[395,-88],[428,-90]];
const EA=[0,1,2,3,4,5,6,7,8],planSet=x=>x<156?EA:x<330?[]:x<395?[0,1,5]:x<422?[0]:[];
const PL=`<svg width='16' height='16' viewBox='0 0 16 16' aria-hidden='true'><path d='M4 2l10 6-10 6z' fill='currentColor'/></svg>`,PA=`<svg width='16' height='16' viewBox='0 0 16 16' aria-hidden='true'><path d='M3 2h4v12H3zM9 2h4v12H9z' fill='currentColor'/></svg>`;

let t=0,run=false,spd=1,lang='zh',dr=false,tab=0,ab=false,fin=false,lp=-1,hist=[],log=[],cfg={burn:3000,stroke:1.6},V=null,fl=new Array(9).fill(0),short=false;
const $=i=>document.getElementById(i),L=(z,e)=>lang==='zh'?z:e,cl=(x,a,b)=>Math.max(a,Math.min(b,x));
function lerp(A,x,n){let i=0;while(i<A.length-2&&A[i+1][0]<=x)i++;const a=A[i],b=A[i+1],f=cl((x-a[0])/(b[0]-a[0]),0,1);return a.map((v,j)=>j?v+(b[j]-v)*f:x)}
function S(x){
  const k=lerp(K,x,0),alt=k[1],v=k[2],th=k[3],pr=k[4],mass=30+5.2*pr,I=mass*169.6,rho=1.225*Math.exp(-alt/8500),sos=Math.max(295,340-.0045*alt),M=v/sos,q=.5*rho*v*v/1000;
  const Cd=.3+.55*Math.exp(-Math.pow((M-1.1)/.28,2))+(M>1.4?.05:0),drag=q*Cd*10.5,heat=1.74e-4*Math.sqrt(rho/.3)*v*v*v/1000;
  const k2=lerp(K,x+1,0),g=1+Math.abs(k2[2]-v)/9.81,kN=th/100*planSet(x).filter(i=>!fl[i]).length*845,pk=lerp(PK,x,0)[1];
  const tdv=3+Math.max(0,2600-cfg.burn)/70,pg=1+tdv*tdv/(2*cfg.stroke*9.81),w=.2+6*Math.exp(-Math.pow((x-175)/8,2));
  return{alt,v,th,pr,mass,I,rho,sos,M,q,Cd,drag,heat,g,kN,pk,tdv,pg,w};
}

// ==================== 槽位与书签条控制器 ====================
function mountCard(slotId, cardId, animate = true) {
  const slot = slots[slotId];
  const card = CARDS[cardId];
  if (!slot || !card) return;

  const slotEl = $(`slot-${slotId}`);
  const bodyEl = slotEl.querySelector('.slot-body');
  const titleEl = slotEl.querySelector('.slot-title');
  const simTag = slotEl.querySelector('.slot-sim-tag');

  if (animate && slot.cardId && slot.cardId !== cardId) {
    bodyEl.classList.add('card-anim-out');
    setTimeout(() => {
      bodyEl.innerHTML = '';
      card.mount(bodyEl);
      if (V) card.update(bodyEl, V);
      bodyEl.classList.remove('card-anim-out');
      bodyEl.classList.add('card-anim-in');
      setTimeout(() => bodyEl.classList.remove('card-anim-in'), 200);
    }, 120);
  } else {
    bodyEl.innerHTML = '';
    card.mount(bodyEl);
    if (V) card.update(bodyEl, V);
  }

  titleEl.textContent = L(card.title.zh, card.title.en);
  simTag.style.display = card.isSim ? 'inline-block' : 'none';
  slot.cardId = cardId;
  slot.mountTime = Date.now();

  if (animate) {
    slotEl.classList.add('slot-flash');
    setTimeout(() => slotEl.classList.remove('slot-flash'), 600);
  }

  renderBookmarks();
}

function renderBookmarks() {
  ['left', 'right'].forEach(side => {
    const strip = $(`bm-${side}`);
    if (!strip) return;
    const cardsOnSide = Object.values(CARDS).filter(c => c.side === side);
    strip.innerHTML = cardsOnSide.map(c => {
      // 检查当前卡片在哪个槽位
      let slotNum = '';
      if (slots[side === 'left' ? 'l1' : 'r1'].cardId === c.id) slotNum = '①';
      else if (slots[side === 'left' ? 'l2' : 'r2'].cardId === c.id) slotNum = '②';
      const isActive = slotNum !== '';
      const summaryText = V && c.summary ? c.summary(V) : '';

      return `
        <div class="bm-item ${isActive ? 'active' : ''}" data-cid="${c.id}" data-side="${side}">
          ${slotNum ? `<span class="bm-badge">${slotNum}</span>` : ''}
          <span class="bm-text">${L(c.short.zh, c.short.en)}</span>
          <span class="bm-alert" id="bm_al_${c.id}"></span>
          <div class="bm-hover-pop">
            <div style="font-weight:600">${L(c.title.zh, c.title.en)}</div>
            <div style="font-size:11px;color:var(--t2);margin-top:2px">${summaryText}</div>
          </div>
        </div>`;
    }).join('');

    // 点击换牌事件绑定
    strip.querySelectorAll('.bm-item').forEach(item => {
      item.onclick = () => swapCardByBookmark(item.dataset.cid);
    });
  });
}

function swapCardByBookmark(cardId) {
  const card = CARDS[cardId];
  if (!card) return;

  // 如果处于指定槽位模式 (点击了槽位 ↻)
  if (targetSelectSlot) {
    const targetSlot = slots[targetSelectSlot];
    if (targetSlot) {
      mountCard(targetSelectSlot, cardId, true);
      targetSlot.manualOverride = true;
      exitTargetSelectMode();
      return;
    }
  }

  // 检查是否已经在某个槽位显示
  const existingSlotId = Object.keys(slots).find(k => slots[k].cardId === cardId);
  if (existingSlotId) {
    const slotEl = $(`slot-${existingSlotId}`);
    slotEl.classList.add('slot-flash');
    setTimeout(() => slotEl.classList.remove('slot-flash'), 600);
    return;
  }

  // 查找该侧未被钉住且 mountTime 最早的槽位 (LRU)
  const candidateSlots = Object.values(slots)
    .filter(s => s.side === card.side && !s.pinned)
    .sort((a, b) => a.mountTime - b.mountTime);

  if (candidateSlots.length === 0) {
    // 该侧槽位均被钉住
    const sideSlots = Object.values(slots).filter(s => s.side === card.side);
    sideSlots.forEach(s => {
      const el = $(`slot-${s.id}`);
      el.classList.add('slot-flash');
      setTimeout(() => el.classList.remove('slot-flash'), 600);
    });
    flash('alr', L('该侧槽位均已钉住，请先取消钉住或点 ↻ 指定', 'Slots are pinned, unpin or use ↻ to assign'), 'var(--wn)', 2000);
    return;
  }

  const chosenSlot = candidateSlots[0];
  mountCard(chosenSlot.id, cardId, true);
  chosenSlot.manualOverride = true; // 软接管生效
}

function enterTargetSelectMode(slotId) {
  exitTargetSelectMode();
  targetSelectSlot = slotId;
  const slotEl = $(`slot-${slotId}`);
  slotEl.classList.add('slot-target-select');
  slotEl.querySelector('.btn-swap').classList.add('active-select');
  flash('alr', L(`已选择槽位 ${slotId.toUpperCase()}，请点击边缘书签换入`, `Slot ${slotId.toUpperCase()} selected: click a bookmark`), 'var(--ac)', 2500);
}

function exitTargetSelectMode() {
  if (!targetSelectSlot) return;
  const slotEl = $(`slot-${targetSelectSlot}`);
  if (slotEl) {
    slotEl.classList.remove('slot-target-select');
    slotEl.querySelector('.btn-swap').classList.remove('active-select');
  }
  targetSelectSlot = null;
}

// ==================== 调度器与预告通知 ====================
function checkSchedule(currentT) {
  if (!isAuto || ab || fin) return;

  const schedIdx = SCHEDULE.findIndex(s => currentT >= s.start && currentT < s.end);
  if (schedIdx === -1) return;

  const currentSched = SCHEDULE[schedIdx];
  const nextSched = SCHEDULE[schedIdx + 1];

  // 10 秒切换预告
  if (nextSched && (nextSched.start - currentT) <= 10 && (nextSched.start - currentT) > 0) {
    showSchedulePreviewNotice(nextSched, Math.ceil(nextSched.start - currentT));
  } else {
    hideSchedulePreviewNotice();
  }

  // 跨越调度节点时触发自动换牌
  if (schedIdx !== lastScheduleIndex) {
    lastScheduleIndex = schedIdx;
    applyScheduledCards(currentSched);
  }
}

function showSchedulePreviewNotice(sched, remainSec) {
  const targets = [
    { slotId: 'l1', cardId: sched.l1 },
    { slotId: 'l2', cardId: sched.l2 },
    { slotId: 'r1', cardId: sched.r1 },
    { slotId: 'r2', cardId: sched.r2 }
  ];

  targets.forEach(t => {
    const slot = slots[t.slotId];
    if (slot.pinned || slot.keepThisSchedule || slot.cardId === t.cardId) return;
    const slotEl = $(`slot-${t.slotId}`);
    const bar = slotEl.querySelector('.slot-prev-bar');
    const txt = bar.querySelector('.sp-txt');
    const btn = bar.querySelector('.sp-btn');
    const targetCard = CARDS[t.cardId];
    bar.style.display = 'flex';
    txt.textContent = `${L(sched.name.zh, sched.name.en)} −${remainSec}s · ${L('即将切换为','Next:')} ${L(targetCard.title.zh, targetCard.title.en)}`;
    btn.onclick = () => {
      slot.keepThisSchedule = true;
      bar.style.display = 'none';
      flash('alr', L(`已锁定当前卡片，跳过本次自动切换`, `Kept current card for this phase`), 'var(--ac)', 1800);
    };
  });
}

function hideSchedulePreviewNotice() {
  document.querySelectorAll('.slot-prev-bar').forEach(bar => bar.style.display = 'none');
}

function applyScheduledCards(sched) {
  const targets = [
    { slotId: 'l1', cardId: sched.l1 },
    { slotId: 'l2', cardId: sched.l2 },
    { slotId: 'r1', cardId: sched.r1 },
    { slotId: 'r2', cardId: sched.r2 }
  ];

  targets.forEach(t => {
    const slot = slots[t.slotId];
    if (slot.pinned) return;
    if (slot.keepThisSchedule) {
      slot.keepThisSchedule = false;
      return;
    }
    slot.manualOverride = false; // 进入新阶段，重置手动软接管
    if (slot.cardId !== t.cardId) {
      mountCard(t.slotId, t.cardId, true);
    }
  });
}

function checkAlerts(ctx) {
  const now = Date.now();
  if (now - lastAlertPopupTime < 8000) return;

  const activeCardIds = Object.values(slots).map(s => s.cardId);
  for (const cardId in CARDS) {
    const card = CARDS[cardId];
    if (!card.alert) continue;
    const al = card.alert(ctx);
    // 更新书签小圆点状态
    const dot = $(`bm_al_${cardId}`);
    if (dot) {
      dot.style.display = al > 0 ? 'block' : 'none';
      dot.className = 'bm-alert' + (al === 2 ? ' crit' : '');
    }
    // 临界告警且未在屏幕显示 -> 自动弹出顶替
    if (al === 2 && !activeCardIds.includes(cardId)) {
      const unpinned = Object.values(slots)
        .filter(s => s.side === card.side && !s.pinned)
        .sort((a, b) => a.mountTime - b.mountTime);
      if (unpinned.length > 0) {
        lastAlertPopupTime = now;
        mountCard(unpinned[0].id, cardId, true);
        flash('alr', L('⚠ 临界告警自动换入: ', '⚠ Critical Alert: ') + L(card.title.zh, card.title.en), 'var(--cr)', 2500);
        break;
      }
    }
  }
}

// ==================== 仿真循环 Tick 与 Draw ====================
function tick() {
  if (run && !ab && !fin) {
    t = Math.min(END, t + .1 * spd);
    const b0 = mg(S(t), t)[0];
    if (b0.r != null && b0.r < 0) short = true;
    const ph = P.filter(p => p <= t).length - 1;
    if (ph !== lp) {
      lp = ph;
      ev(L(NZ[ph], NE[ph]));
      if (ph > 0) flash('fl', L(NZ[ph], NE[ph]), 'var(--tx)', 1800);
    }
    if (t >= 420 && !fin) {
      fin = true;
      run = false;
      const s = S(420), bad = s.pg > 4.5 || short;
      hist.unshift({ b: cfg.burn, k: cfg.stroke, v: s.tdv, g: s.pg, bad });
      ev(bad ? L('判定: 坠毁', 'Verdict: LOST') : L('判定: 着陆成功', 'Verdict: LANDED'));
      flash('vd', bad ? 'VEHICLE LOST' : 'TOUCHDOWN CONFIRMED', bad ? 'var(--cr)' : 'var(--ac)', 0);
    }
    checkSchedule(t);
  }
  draw();
}

function draw() {
  const s = S(t), ph = P.filter(p => p <= t).length - 1, m = mg(s, t);
  V = s;

  // 顶栏与全局提示
  $('sub').textContent = L('KSC LC-39A · 回收任务', 'KSC LC-39A · RECOVERY');
  $('bDrw').textContent = L('D · 工程抽屉', 'D · Engineering');
  $('phn').textContent = ab ? 'ABORT' : L(NE[ph].toUpperCase(), NE[ph].toUpperCase());
  $('phn').style.color = ab ? 'var(--cr)' : 'var(--ac)';
  $('phs').textContent = ab ? L('飞行终止', 'Flight terminated') : L(NZ[ph], NE[ph]) + (run ? '' : ' · ' + (fin ? L('已结束', 'ended') : L('待命', 'standby')));

  const bad = m.filter(r => r.s > 0);
  const a = $('alr');
  if (bad.length && !ab && !fin && a.style.opacity !== '1') {
    const r = bad[0];
    a.style.display = 'inline-block';
    a.textContent = (r.s > 1 ? L('警告 · ', 'Warning · ') : L('注意 · ', 'Caution · ')) + L(r.z, r.e) + ' ' + r.v;
    const c = r.s > 1 ? '255,77,94' : '255,176,32';
    a.style.border = '1px solid rgba(' + c + ',.5)';
    a.style.background = 'rgba(' + c + ',.08)';
    a.style.color = r.s > 1 ? 'var(--cr)' : 'var(--wn)';
  } else if (!bad.length && a.style.opacity !== '1') {
    a.style.display = 'none';
  }

  // 驱动当前激活的 4 张卡片执行更新
  Object.values(slots).forEach(sl => {
    const card = CARDS[sl.cardId];
    if (card) {
      const bodyEl = $(`slot-${sl.id}`).querySelector('.slot-body');
      card.update(bodyEl, s);
    }
  });

  checkAlerts(s);

  // 底栏与时间轴
  if (!$('nds').children.length) $('nds').innerHTML = NZ.map(() => '<div class="nd f"><b></b><span></span></div>').join('');
  [...$('nds').children].forEach((e, i) => {
    const k = i < ph ? 'd' : i == ph ? 'c' : 'f', o = e.dataset.k;
    e.querySelector('span').textContent = L(NZ[i], NE[i]);
    if (o !== k) {
      e.className = 'nd ' + k;
      e.dataset.k = k;
      if (o !== undefined) {
        e.classList.add('pop');
        setTimeout(() => e.classList.remove('pop'), 700);
      }
    }
    e.classList.toggle('nx', i == ph + 1);
  });
  $('tl').classList.toggle('run', run && !ab && !fin);

  const fr = ph >= 8 ? 8 : ph + (t - P[ph]) / (P[ph + 1] - P[ph]);
  $('pg').style.width = (89 * fr / 8) + '%';
  $('hdp').style.left = (5.55 + 89 * fr / 8) + '%';
  $('hlb').textContent = L(NZ[ph], NE[ph]);
  $('hlb').style.left = cl(5.55 + 89 * fr / 8, 7, 93) + '%';

  $('met').textContent = fT(t);
  $('nx').textContent = ph < 8 ? L('下一事件 ', 'Next ') + L(NZ[ph + 1], NE[ph + 1]) + ' · ' + Math.ceil(P[ph + 1] - t) + ' s' : L('任务结束', 'End');

  const pl = planSet(t), el = pl.filter(i => !fl[i] && s.th > 0).length;
  $('ve').textContent = pl.length ? el + ' / ' + pl.length : '—';
  $('vp').textContent = s.pr.toFixed(0) + '%';
  $('le').textContent = L('发动机', 'ENG');
  $('lp').textContent = L('推进剂', 'PROP');

  $('ls').textContent = L('速度', 'SPEED');
  $('vs').innerHTML = Math.round(s.v * 3.6).toLocaleString() + '<small>km/h</small>';
  $('la').textContent = L('高度', 'ALT');
  $('va').innerHTML = s.alt >= 10000 ? (s.alt / 1000).toFixed(1) + '<small>km</small>' : Math.round(s.alt) + '<small>m</small>';

  const gk = run ? 'p' : t > 0 && !fin ? 'r' : 'l';
  if ($('bGo').dataset.k !== gk + lang) {
    $('bGo').dataset.k = gk + lang;
    $('bGo').innerHTML = (run ? PA : PL) + (gk == 'l' ? '<span style="margin-left:8px">' + L('启动发射', 'Launch') + '</span>' : '');
    $('bGo').setAttribute('aria-label', run ? L('暂停', 'Pause') : gk == 'r' ? L('继续', 'Resume') : L('启动发射', 'Launch'));
  }
  $('bRst').textContent = L('重来', 'Reset');
  $('bSp').textContent = spd + '×';
  $('bAb').disabled = ab || fin;
  $('abt').textContent = L('ABORT · 长按', 'ABORT · HOLD');

  if (dr) db();
}

// ==================== 工程抽屉函数 ====================
function db() {
  const s = V, e = $('db');
  if (tab == 2) { const h = $('hl'); if (h) h.innerHTML = hs(); return; }
  if (tab == 0) {
    const ok = s.mass > 0 && s.I / s.mass > 169 && s.I / s.mass < 170;
    e.innerHTML = [[L('质量', 'Mass'), s.mass.toFixed(1) + ' t'], [L('转动惯量', 'Inertia'), Math.round(s.I).toLocaleString() + ' t·m²'], [L('质量/惯量一致', 'Mass–inertia'), ok ? '✓' : '✗'], [L('大气密度', 'Density'), s.rho.toExponential(2) + ' kg/m³'], [L('马赫', 'Mach'), s.M.toFixed(2)], [L('阻力系数 Cd', 'Cd'), s.Cd.toFixed(3) + (Math.abs(s.M - 1.1) < .3 ? ' ▲' : '')], [L('动压', 'Q'), s.q.toFixed(2) + ' kPa'], [L('阻力', 'Drag'), s.drag.toFixed(1) + ' kN'], [L('热流 ∝ √ρ·v³', 'Heat ∝ √ρ·v³'), s.heat.toFixed(1) + ' kW/m²'], [L('角速度', 'Rate'), s.w.toFixed(2) + ' °/s']].map(r => '<div class="row"><span>' + r[0] + '</span><span class="m">' + r[1] + '</span></div>').join('');
  }
  if (tab == 1) {
    const u = (100 - s.pr) * 5.2, cg = t > 156 ? (t - 156) * .8 : 0;
    e.innerHTML = [[L('剩余推进剂', 'Remaining'), s.pr.toFixed(2) + '% · ' + ((s.pr) * 5.2).toFixed(1) + ' t'], [L('主发动机消耗', 'Main engines'), (u - cg / 1000).toFixed(1) + ' t'], [L('姿控冷气消耗', 'Cold gas'), cg.toFixed(0) + ' kg'], [L('当前推力', 'Thrust'), Math.round(s.kN) + ' kN'], [L('缓冲行程限值', 'Stroke'), cfg.stroke.toFixed(2) + ' m'], [L('预测触地过载', 'Pred. G'), s.pg.toFixed(2) + ' G']].map(r => '<div class="row"><span>' + r[0] + '</span><span class="m">' + r[1] + '</span></div>').join('') + '<p class="lb" style="margin-top:14px;line-height:1.6;text-transform:none;letter-spacing:0">' + L('姿控消耗计入同一本推进剂账本。', 'Attitude-control use is booked in the same propellant ledger.') + '</p>';
  }
  if (tab == 3) e.innerHTML = '<div class="lg">' + (log.length ? log.join('<br>') : L('暂无事件', 'No events')) + '</div>';
}
function hs() {
  return hist.length ? hist.map(h => '<div class="row"><span>' + L('点火', 'Burn') + ' ' + h.b + ' m · ' + h.k.toFixed(2) + ' m</span><span class="m" style="color:' + (h.bad ? 'var(--cr)' : 'var(--ac)') + '">' + h.v.toFixed(1) + ' m/s · ' + h.g.toFixed(1) + ' G</span></div>').join('') : '<div class="lb">' + L('暂无记录', 'No runs yet') + '</div>';
}
function showTab() {
  $('tabs').innerHTML = [['验证', 'Verify'], ['推进', 'Propulsion'], ['调参', 'Tuning'], ['日志', 'Log']].map((n, i) => '<button class="' + (i == tab ? 'on' : '') + '" data-t="' + i + '">' + L(n[0], n[1]) + '</button>').join('');
  if (tab == 2) {
    $('db').innerHTML = '<div class="row"><span>' + L('着陆点火高度', 'Burn altitude') + '</span><span class="m" id="lb1">' + cfg.burn + ' m</span></div><input type="range" id="s1" min="1800" max="3600" step="100" value="' + cfg.burn + '"><div class="row" style="margin-top:12px"><span>' + L('缓冲行程', 'Stroke') + '</span><span class="m" id="lb2">' + cfg.stroke.toFixed(2) + ' m</span></div><input type="range" id="s2" min="0.3" max="2.6" step="0.05" value="' + cfg.stroke + '"><p class="lb" style="text-transform:none;letter-spacing:0;line-height:1.6;margin:12px 0">' + L('改参数后点“重来”，运行结果会进入下表。', 'Change values, press Reset; each run is listed below.') + '</p><div id="hl">' + hs() + '</div>';
    $('s1').oninput = e => { cfg.burn = +e.target.value; $('lb1').textContent = cfg.burn + ' m'; };
    $('s2').oninput = e => { cfg.stroke = +e.target.value; $('lb2').textContent = cfg.stroke.toFixed(2) + ' m'; };
  } else db();
}

// ==================== 用户交互控制 ====================
function go() {
  if (fin || ab) return;
  run = !run;
  if (run && t == 0) ev(L('倒计时开始', 'Sequence start'));
  $('vd').style.opacity = 0;
  draw();
}
function rst() {
  t = 0; run = false; ab = false; fin = false; lp = -1; log = []; short = false; fl.fill(0);
  lastScheduleIndex = -1;
  hideSchedulePreviewNotice();
  $('vd').style.opacity = 0;
  $('fl').style.opacity = 0;
  // 重置回初始卡片排布
  mountCard('l1', 'eng1', false);
  mountCard('l2', 'prop', false);
  mountCard('r1', 'stage', false);
  mountCard('r2', 'margin', false);
  draw();
  if (dr) showTab();
}
function abort() {
  if (ab || fin) return;
  ab = true; run = false; ev('ABORT');
  flash('vd', 'FLIGHT TERMINATED', 'var(--cr)', 0);
  draw();
}

const sp = [1, 2, 5, 10], cs = () => { spd = sp[(sp.indexOf(spd) + 1) % 4]; draw(); };
const dw = () => { dr = !dr; $('drw').classList.toggle('o', dr); if (dr) showTab(); };
const lg = () => {
  lang = lang == 'zh' ? 'en' : 'zh';
  document.documentElement.lang = lang == 'zh' ? 'zh-CN' : 'en';
  // 刷新所有卡片标题与内容
  Object.values(slots).forEach(sl => {
    const card = CARDS[sl.cardId];
    if (card) {
      const slotEl = $(`slot-${sl.id}`);
      slotEl.querySelector('.slot-title').textContent = L(card.title.zh, card.title.en);
    }
  });
  renderBookmarks();
  draw();
  if (dr) showTab();
};

const toggleAuto = () => {
  isAuto = !isAuto;
  const btn = $('bAuto');
  btn.classList.toggle('hold', !isAuto);
  $('autoTxt').textContent = isAuto ? 'AUTO' : 'HOLD';
  flash('alr', isAuto ? L('自动调度模式已开启 (AUTO)', 'Auto Schedule: AUTO') : L('手动保持模式已开启 (HOLD)', 'Schedule Hold: HOLD'), 'var(--ac)', 1800);
};

// 槽位头部按钮初始化 (📌 钉住, ↻ 换卡, ⤢ 展开)
function initSlotControls() {
  Object.keys(slots).forEach(sid => {
    const slotEl = $(`slot-${sid}`);
    const pinBtn = slotEl.querySelector('.btn-pin');
    const swapBtn = slotEl.querySelector('.btn-swap');
    const expBtn = slotEl.querySelector('.btn-exp');

    pinBtn.onclick = () => {
      slots[sid].pinned = !slots[sid].pinned;
      pinBtn.classList.toggle('pinned', slots[sid].pinned);
      flash('alr', slots[sid].pinned ? L(`已钉住槽位 ${sid.toUpperCase()} (锁定)`, `Slot ${sid.toUpperCase()} Pinned`) : L(`已取消钉住 ${sid.toUpperCase()}`, `Slot ${sid.toUpperCase()} Unpinned`), 'var(--ac)', 1600);
    };

    swapBtn.onclick = () => {
      if (targetSelectSlot === sid) exitTargetSelectMode();
      else enterTargetSelectMode(sid);
    };

    expBtn.onclick = () => {
      const otherSid = sid.endsWith('1') ? sid.replace('1', '2') : sid.replace('2', '1');
      const otherEl = $(`slot-${otherSid}`);
      slots[sid].expanded = !slots[sid].expanded;
      slotEl.classList.toggle('expanded', slots[sid].expanded);
      otherEl.classList.toggle('collapsed', slots[sid].expanded);
      expBtn.textContent = slots[sid].expanded ? '⤡' : '⤢';
    };
  });
}

// 绑定顶栏与底栏事件
$('bGo').onclick = go;
$('bRst').onclick = rst;
$('bSp').onclick = cs;
$('bAuto').onclick = toggleAuto;

let hd = null;
const abE = () => { clearTimeout(hd); hd = null; const f = $('abf'); f.style.transition = 'width .2s'; f.style.width = '0'; };
const abS = () => {
  if (hd || ab || fin) return;
  const f = $('abf');
  f.style.transition = 'width 1s linear';
  f.style.width = '100%';
  hd = setTimeout(() => { abE(); abort(); }, 1000);
};
['pointerup', 'pointerleave', 'pointercancel', 'blur', 'keyup'].forEach(n => $('bAb').addEventListener(n, abE));
$('bAb').addEventListener('pointerdown', abS);
$('bAb').addEventListener('keydown', e => { if (e.key == ' ' || e.key == 'Enter') { e.preventDefault(); abS(); } });
$('bDrw').onclick = dw;
$('bLang').onclick = lg;
$('tabs').onclick = e => { const b = e.target.closest('button'); if (b) { tab = +b.dataset.t; showTab(); } };

addEventListener('keydown', e => {
  if (e.target.tagName == 'INPUT' || e.target.id == 'bAb') return;
  const k = e.key.toLowerCase();
  if (k == ' ') { e.preventDefault(); go(); }
  else if (k == 'r') rst();
  else if (k == 'd') dw();
  else if (k == 'l') lg();
  else if (k == 'a') toggleAuto();
  else if (k == ']' || k == '[') cs();
  else if (['1', '2', '3', '4'].includes(k)) {
    const sids = ['l1', 'l2', 'r1', 'r2'];
    enterTargetSelectMode(sids[+k - 1]);
  } else if (k == 'p' && targetSelectSlot) {
    const sid = targetSelectSlot;
    slots[sid].pinned = !slots[sid].pinned;
    $(`slot-${sid}`).querySelector('.btn-pin').classList.toggle('pinned', slots[sid].pinned);
    exitTargetSelectMode();
  }
});

// 初始化挂载
initSlotControls();
mountCard('l1', 'eng1', false);
mountCard('l2', 'prop', false);
mountCard('r1', 'stage', false);
mountCard('r2', 'margin', false);
renderBookmarks();
draw();
setInterval(tick, 100);
</script>
</body>
</html>
